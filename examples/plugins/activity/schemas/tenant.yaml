type: object
properties:
  webhook_secret:
    type: string
    title: Webhook secret
    description: Callers of the note webhook send it in the X-Activity-Secret header
    x-secret: true
    x-i18n:
      title: { zh-CN: Webhook 密钥 }
      description: { zh-CN: 调用推送消息 Webhook 时放在 X-Activity-Secret 请求头里 }
  include_answers:
    type: boolean
    title: Show answer text
    description: Keep the first line of each answer in the feed, not just the question
    default: false
    x-i18n:
      title: { zh-CN: 显示回答内容 }
      description: { zh-CN: 在动态里保留每个回答的第一行，而不只是问题 }
