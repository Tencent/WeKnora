type: object
properties:
  client_id:
    type: string
    title: OAuth client ID
    description: "Client ID of an OAuth 2.0 (3LO) app in the Atlassian developer console, with the Jira API scopes read:jira-work and read:jira-user and the callback URL <WeKnora address>/api/v1/plugin-oauth/callback"
    x-order: 1
    x-i18n:
      title: { zh-CN: OAuth 客户端 ID }
