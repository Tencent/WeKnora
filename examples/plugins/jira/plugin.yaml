schemaVersion: 1
id: weknora-examples.jira
version: 1.1.0
apiVersion: weknora.plugin/v1
name: { en-US: Jira, zh-CN: Jira }
description:
  en-US: Sync Jira Cloud issues, with their comments, into a knowledge base; agent tools to search and read issues; and a skill for triaging them. Connects with Atlassian OAuth or an API token; shows dynamic form options and OAuth fields.
  zh-CN: 把 Jira Cloud 的问题（含评论）同步到知识库，提供搜索和读取问题的 Agent 工具，以及问题分诊技能。支持 Atlassian OAuth 授权或 API 令牌；演示表单动态选项与 OAuth 字段。
publisher: { id: weknora-examples, name: WeKnora examples }
homepage: https://github.com/Tencent/WeKnora/tree/main/examples/plugins/jira
license: MIT
icon: icon.svg
runtime:
  type: host
  kind: binary
  entry: "bin/{os}-{arch}/jira"
  resources: { cpu: 500m, memory: 256Mi }
permissions:
  # The OAuth API gateway and the sites themselves. WeKnora, not the plugin,
  # talks to auth.atlassian.com.
  egress: [api.atlassian.com, "*.atlassian.net"]
  # Start data source syncs when Jira reports a change (the webhook below),
  # and note deleted issues for them in the key-value store.
  hostApi: [datasources, kv]
config:
  # The platform's Atlassian OAuth 2.0 (3LO) app. Without it, workspaces can
  # still connect with an API token.
  system: schemas/system.yaml
  # The connection the agent tools use in this workspace.
  tenant: schemas/tenant.yaml
contributes:
  connectors:
    - id: jira
      name: { en-US: Jira, zh-CN: Jira }
      description:
        en-US: Issues of the selected Jira Cloud projects, with comments
        zh-CN: 同步所选 Jira Cloud 项目的问题及评论
      icon: icon.svg
      capabilities: [incremental, streaming]
      instanceSchema: schemas/connector.yaml
  mcpServers:
    # No url: the plugin serves these tools itself.
    - id: tools
      name: { en-US: Jira, zh-CN: Jira }
      description:
        en-US: Search Jira issues with JQL or text, and read one issue with its comments
        zh-CN: 用 JQL 或关键词搜索 Jira 问题，读取单个问题及其评论
      toolViews:
        search_issues:
          view: table
          items: issues
          columns:
            - { field: key, title: { en-US: Key, zh-CN: 编号 }, link: url }
            - { field: summary, title: { en-US: Summary, zh-CN: 摘要 } }
            - { field: status, title: { en-US: Status, zh-CN: 状态 } }
            - { field: assignee, title: { en-US: Assignee, zh-CN: 负责人 } }
            - { field: updated, title: { en-US: Updated, zh-CN: 更新时间 } }
        get_issue: { view: markdown, field: markdown }
  webhooks:
    - id: issues
      name: { en-US: Issue changes, zh-CN: 问题变更 }
      description:
        en-US: "Register this URL in Jira (Settings → System → WebHooks) for issue created, updated and deleted events. Data sources syncing the issue's project then sync at once instead of waiting for their schedule, deleted issues included."
        zh-CN: "在 Jira（设置 → 系统 → WebHooks）中登记此地址，勾选问题创建、更新、删除事件。同步该问题所在项目的数据源会立即同步（包括删除的问题），而不必等待定时同步。"
  skills:
    - id: jira-triage
      name: { en-US: Jira triage, zh-CN: Jira 问题分诊 }
      description:
        en-US: Find duplicates, related work and owners of a Jira issue in the synced issues
        zh-CN: 在已同步的问题中查找重复、相关工作和负责人
      path: skills/jira-triage
