type: object
properties:
  include_outputs:
    type: boolean
    title: Include cell outputs
    description: Index what code cells printed and plotted, not just the code
    default: true
    x-i18n:
      title: { zh-CN: 包含单元格输出 }
      description: { zh-CN: 除代码外，也索引代码单元格的打印内容和图表 }
  max_output_chars:
    type: integer
    title: Output length limit
    description: Characters kept from each text output
    default: 2000
    minimum: 0
    x-i18n:
      title: { zh-CN: 输出长度上限 }
      description: { zh-CN: 每段文本输出保留的字符数 }
