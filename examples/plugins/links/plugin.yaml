schemaVersion: 1
id: weknora-examples.links
version: 1.0.0
apiVersion: weknora.plugin/v1
name: { en-US: Team links, zh-CN: 团队链接 }
description:
  en-US: A page of links for the workspace and a tab of links on each knowledge base. Shows plugin pages, written in Python.
  zh-CN: 空间的常用链接页，以及每个知识库上的链接页签。演示插件页面，用 Python 编写。
publisher: { id: weknora-examples, name: WeKnora examples }
homepage: https://github.com/Tencent/WeKnora/tree/main/examples/plugins/links
license: MIT
runtime: { type: host, kind: python, entry: main.py }
permissions:
  # Links live in the plugin's key-value store, per workspace.
  hostApi: [kv]
contributes:
  pages:
    - id: links
      name: { en-US: Team links, zh-CN: 团队链接 }
      description: { en-US: Links the workspace shares, zh-CN: 空间共享的常用链接 }
      entry: ui/index.html
  settingsSections:
    - id: manage
      name: { en-US: Team links, zh-CN: 团队链接 }
      entry: ui/manage.html
      # minRole defaults to admin for settings sections
  kbTabs:
    - id: links
      name: { en-US: Links, zh-CN: 链接 }
      description: { en-US: Links about this knowledge base, zh-CN: 与本知识库相关的链接 }
      entry: ui/kb.html
