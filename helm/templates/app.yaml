{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 8 }}
    spec:
      {{- include "weknora.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      {{- with .Values.app.podSecurityContext | default .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "weknora.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Application settings
            - name: GIN_MODE
              value: {{ .Values.app.env.GIN_MODE | quote }}
            - name: TZ
              value: {{ .Values.app.env.TZ | quote }}
            # Database configuration
            - name: DB_DRIVER
              value: {{ include "weknora.databaseDriver" . | quote }}
            - name: DB_HOST
              value: {{ include "weknora.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "weknora.databasePort" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_NAME
            {{- if eq (include "weknora.databaseDriver" .) "mysql" }}
            - name: DB_MAX_OPEN_CONNS
              value: {{ .Values.database.mysql.pool.maxOpenConns | quote }}
            - name: DB_MAX_IDLE_CONNS
              value: {{ .Values.database.mysql.pool.maxIdleConns | quote }}
            - name: DB_CONN_MAX_LIFETIME
              value: {{ .Values.database.mysql.pool.connMaxLifetime | quote }}
            - name: DB_CONN_MAX_IDLE_TIME
              value: {{ .Values.database.mysql.pool.connMaxIdleTime | quote }}
            - name: DB_USE_TLS
              value: {{ ternary "true" "false" .Values.database.mysql.tls.enabled | quote }}
            - name: DB_TLS_SERVER_NAME
              value: {{ .Values.database.mysql.tls.serverName | quote }}
            - name: DB_TLS_INSECURE_SKIP_VERIFY
              value: {{ ternary "true" "false" .Values.database.mysql.tls.insecureSkipVerify | quote }}
            - name: DB_CONNECT_TIMEOUT
              value: {{ .Values.database.mysql.timeouts.connect | quote }}
            - name: DB_READ_TIMEOUT
              value: {{ .Values.database.mysql.timeouts.read | quote }}
            - name: DB_WRITE_TIMEOUT
              value: {{ .Values.database.mysql.timeouts.write | quote }}
            {{- if and .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName .Values.database.mysql.tls.caFile }}
            - name: DB_TLS_CA
              value: {{ printf "%s/%s" .Values.database.mysql.tls.mountPath .Values.database.mysql.tls.caFile | quote }}
            {{- end }}
            {{- if and .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName .Values.database.mysql.tls.certFile }}
            - name: DB_TLS_CERT
              value: {{ printf "%s/%s" .Values.database.mysql.tls.mountPath .Values.database.mysql.tls.certFile | quote }}
            {{- end }}
            {{- if and .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName .Values.database.mysql.tls.keyFile }}
            - name: DB_TLS_KEY
              value: {{ printf "%s/%s" .Values.database.mysql.tls.mountPath .Values.database.mysql.tls.keyFile | quote }}
            {{- end }}
            {{- end }}
            # Redis configuration
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: REDIS_USERNAME
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "0"
            - name: REDIS_PREFIX
              value: "stream:"
            - name: STREAM_MANAGER_TYPE
              value: {{ .Values.app.env.STREAM_MANAGER_TYPE | quote }}
            # Security
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: JWT_SECRET
            - name: SYSTEM_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: SYSTEM_AES_KEY
            # Retrieval & Storage
            - name: RETRIEVE_DRIVER
              value: {{ include "weknora.retrievalDriver" . | quote }}
            {{- if and (eq (include "weknora.databaseDriver" .) "mysql") (has "mysql" (splitList "," (include "weknora.retrievalDriver" .))) }}
            # The MySQL retriever uses MYSQL_* rather than DB_* variables.
            # Reuse the selected main-database endpoint and credentials so the
            # single MySQL mode cannot silently target localhost or another DB.
            - name: MYSQL_HOST
              value: {{ include "weknora.databaseHost" . | quote }}
            - name: MYSQL_PORT
              value: {{ include "weknora.databasePort" . | quote }}
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: DB_NAME
            - name: MYSQL_USE_TLS
              value: {{ ternary "true" "false" .Values.database.mysql.tls.enabled | quote }}
            - name: MYSQL_TLS_SERVER_NAME
              value: {{ .Values.database.mysql.tls.serverName | quote }}
            - name: MYSQL_TLS_INSECURE_SKIP_VERIFY
              value: {{ ternary "true" "false" .Values.database.mysql.tls.insecureSkipVerify | quote }}
            - name: MYSQL_CONNECT_TIMEOUT
              value: {{ .Values.database.mysql.timeouts.connect | quote }}
            - name: MYSQL_READ_TIMEOUT
              value: {{ .Values.database.mysql.timeouts.read | quote }}
            - name: MYSQL_WRITE_TIMEOUT
              value: {{ .Values.database.mysql.timeouts.write | quote }}
            {{- if and .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName .Values.database.mysql.tls.caFile }}
            - name: MYSQL_TLS_CA
              value: {{ printf "%s/%s" .Values.database.mysql.tls.mountPath .Values.database.mysql.tls.caFile | quote }}
            {{- end }}
            {{- if and .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName .Values.database.mysql.tls.certFile }}
            - name: MYSQL_TLS_CERT
              value: {{ printf "%s/%s" .Values.database.mysql.tls.mountPath .Values.database.mysql.tls.certFile | quote }}
            {{- end }}
            {{- if and .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName .Values.database.mysql.tls.keyFile }}
            - name: MYSQL_TLS_KEY
              value: {{ printf "%s/%s" .Values.database.mysql.tls.mountPath .Values.database.mysql.tls.keyFile | quote }}
            {{- end }}
            {{- end }}
            - name: STORAGE_TYPE
              value: {{ .Values.app.env.STORAGE_TYPE | quote }}
            - name: LOCAL_STORAGE_BASE_DIR
              value: {{ .Values.app.env.LOCAL_STORAGE_BASE_DIR | quote }}
            # Document reader
            - name: DOCREADER_ADDR
              value: "docreader:50051"
            # Processing
            - name: AUTO_RECOVER_DIRTY
              value: {{ ternary "false" .Values.app.env.AUTO_RECOVER_DIRTY (eq (include "weknora.databaseDriver" .) "mysql") | quote }}
            - name: CONCURRENCY_POOL_SIZE
              value: {{ .Values.app.env.CONCURRENCY_POOL_SIZE | quote }}
            {{- if .Values.neo4j.enabled }}
            # Neo4j configuration (for GraphRAG)
            # NEO4J_ENABLE 是知识图谱的唯一开关（Go 代码认它，不认 ENABLE_GRAPH_RAG）。
            # neo4j.enabled=true 时自动注入，无需用户单独设置。
            - name: NEO4J_ENABLE
              value: "true"
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: NEO4J_PASSWORD
            {{- end }}
            {{- with .Values.app.extraEnv }}
            # Additional environment variables
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data-files
              mountPath: /data/files
            {{- if and (eq (include "weknora.databaseDriver" .) "mysql") .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName }}
            - name: mysql-tls
              mountPath: {{ .Values.database.mysql.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data-files
          {{- if .Values.dataFiles.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.dataFiles.persistence.existingClaim | default (printf "%s-data-files" (include "weknora.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if and (eq (include "weknora.databaseDriver" .) "mysql") .Values.database.mysql.tls.enabled .Values.database.mysql.tls.secretName }}
        - name: mysql-tls
          secret:
            secretName: {{ .Values.database.mysql.tls.secretName | quote }}
            defaultMode: 0400
            items:
            {{- if .Values.database.mysql.tls.caFile }}
              - key: {{ .Values.database.mysql.tls.caFile | quote }}
                path: {{ .Values.database.mysql.tls.caFile | quote }}
            {{- end }}
            {{- if .Values.database.mysql.tls.certFile }}
              - key: {{ .Values.database.mysql.tls.certFile | quote }}
                path: {{ .Values.database.mysql.tls.certFile | quote }}
            {{- end }}
            {{- if .Values.database.mysql.tls.keyFile }}
              - key: {{ .Values.database.mysql.tls.keyFile | quote }}
                path: {{ .Values.database.mysql.tls.keyFile | quote }}
            {{- end }}
      {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Service name must be "app" - frontend nginx config hardcodes this
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "weknora.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
