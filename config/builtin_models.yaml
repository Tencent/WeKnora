builtin_models:
  - id: builtin-dashscope-glm5
    name: ${LLM_MODEL_NAME}
    type: KnowledgeQA
    source: remote
    description: DashScope OpenAI-compatible chat model
    is_default: true
    parameters:
      base_url: ${LLM_BASE_URL}
      api_key: ${LLM_API_KEY}
      provider: ${LLM_PROVIDER}

  - id: builtin-dashscope-embedding
    name: ${EMBEDDING_MODEL_NAME}
    type: Embedding
    source: remote
    description: DashScope text embedding model
    is_default: true
    parameters:
      base_url: ${EMBEDDING_BASE_URL}
      api_key: ${EMBEDDING_API_KEY}
      provider: ${EMBEDDING_PROVIDER}
      embedding_parameters:
        dimension: 1536
        truncate_prompt_tokens: 0

  - id: builtin-dashscope-rerank
    name: ${RERANK_MODEL_NAME}
    type: Rerank
    source: remote
    description: DashScope rerank model
    is_default: true
    parameters:
      base_url: ${RERANK_BASE_URL}
      api_key: ${RERANK_API_KEY}
      provider: ${RERANK_PROVIDER}
