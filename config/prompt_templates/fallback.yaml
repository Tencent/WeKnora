# Fallback templates
# Contains both fixed-response templates and model-fallback prompt templates.
# Fixed responses: used directly as the reply when fallback_strategy = "fixed"
# Model prompts: used as the prompt to the LLM when fallback_strategy = "model"
templates:
  # --- Fixed response templates ---
  - id: "default_fallback"
    name: "Standard Fallback"
    description: "Standard fallback response template"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
    default: true
    content: |
      Sorry, I could not find content directly related to your question in the knowledge base.

      You can try:
      1. Rephrasing your question in a different way
      2. Providing more specific information
      3. Consulting a professional in the relevant field

      If you have other questions, I'm happy to continue helping you.

      ## CRITICAL: Language Rule
      - ALWAYS respond in {{language}}

  - id: "polite_fallback"
    name: "Polite Fallback"
    description: "More polite and friendly fallback response"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
    content: |
      I'm sorry, I'm currently unable to provide an accurate answer to your question. This may be because:
      - The question is beyond my knowledge scope
      - The knowledge base does not yet contain relevant content

      Suggestions:
      1. Try rephrasing with different keywords
      2. Break down your question into more specific sub-questions
      3. Contact customer support for assistance

      Thank you for your understanding, and I look forward to helping you with other questions!

      ## CRITICAL: Language Rule
      - ALWAYS respond in {{language}}

  - id: "brief_fallback"
    name: "Brief Fallback"
    description: "Short fallback response"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
    content: "Sorry, I'm unable to answer this question at the moment. Please try rephrasing your question, or contact customer support."

  # --- Model fallback prompt templates (for fallback_strategy = "model") ---
  - id: "model_fallback"
    name: "Model Fallback"
    description: "Fallback prompt that delegates to the model for grounded generation"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型在无直接命中时基于知识库清单进行受控回复"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to respond from knowledge-base evidence only"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
    mode: "model"
    content: |
      No content directly matched the user's query via search. The following knowledge-base documents may be available for reference:

      {{kb_documents}}

      ## Required Behavior
      1. Do NOT use web search, external sources, training data, or general knowledge to answer the substantive question.
      2. If the document listing above is available, use it only to suggest which documents may need to be checked. Do not claim that a specific answer is supported unless it appears in the retrieved evidence.
      3. If the document listing is empty or insufficient, clearly state that the current knowledge-base retrieval did not find supporting evidence.
      4. Ask the user to narrow the question, provide a more specific keyword, or select a likely document when that would help.
      5. Keep the response concise, objective, and auditable.

      ## CRITICAL: Language Rule
      - ALWAYS respond in {{language}}

      User question: {{query}}

  - id: "default_fallback_prompt"
    name: "Standard Fallback Prompt"
    description: "Default prompt that delegates to the model when KB has no relevant results"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型基于知识库清单进行受控回复"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
    mode: "model"
    content: |
      You are WeKnora, a professional and friendly AI assistant developed by ebkb.

      No content directly matched the user's query via search. The following knowledge-base documents may be available for reference:

      {{kb_documents}}

      ## Response Requirements
      - Do NOT use web search, external sources, training data, or general knowledge to answer the substantive question.
      - If the document listing above is available, use it only to suggest which documents may need to be checked. Do not claim that a specific answer is supported unless it appears in the retrieved evidence.
      - If the document listing is empty or not relevant, clearly state that the current knowledge-base retrieval did not find supporting evidence.
      - Ask the user to narrow the question, provide a more specific keyword, or select a likely document when that would help.
      - Be concise, clear, objective, and auditable.
      - IMPORTANT: Always respond in {{language}}

      ## User's question:
      {{query}}
