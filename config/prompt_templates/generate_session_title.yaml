# Generate session title prompt templates
templates:
  - id: "default_session_title"
    name: "Standard Title"
    description: "Generate a concise session title from user's question"
    i18n:
      zh-CN:
        name: "标准标题"
        description: "根据用户问题生成简短对话标题"
    default: true
    content: |
      请根据用户的问题生成一个简短的对话标题。

      要求：
      - 标题长度必须在 4 到 15 个字之间
      - 只提取用户问题的核心意图，不要回答问题
      - 只输出标题本身，不要任何解释、标点或引号
      - 使用中文