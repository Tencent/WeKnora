version: "2"
linters:
  enable:
    - lll           # 控制行宽
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    # swag emits one JSON string per field; wrapping those lines is not useful.
    generated: lax
    paths:
      - docs/docs\.go$
formatters:
  enable:
    - gofmt
    - gofumpt
