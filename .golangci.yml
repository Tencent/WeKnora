version: "2"
linters:
  enable:
    - lll           # 控制行宽
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    paths:
      # swag embeds OpenAPI as single-line JSON strings; line-length is not meaningful.
      - docs/docs\.go$
    rules:
      # swag annotations cannot wrap, so a parameter with its enum list or a
      # composed response type has to stay on one line.
      - linters: [lll]
        source: '^\s*// @(Param|Success|Failure|x-)'
formatters:
  enable:
    - gofmt
    - gofumpt
