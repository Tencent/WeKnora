version: "2"
linters:
  enable:
    - lll           # 控制行宽
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    paths:
      # swag embeds OpenAPI as single-line JSON strings; line-length is not meaningful.
      - docs/docs\.go$
formatters:
  enable:
    - gofmt
    - gofumpt
