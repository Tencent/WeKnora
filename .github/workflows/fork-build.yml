name: Fork build images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            context: .
            file: docker/Dockerfile.app
          - component: ui
            context: frontend
            file: frontend/Dockerfile
          - component: docreader
            context: .
            file: docker/Dockerfile.docreader
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/demoasm/weknora-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=fork-${{ matrix.component }}
          cache-to: type=gha,scope=fork-${{ matrix.component }},mode=max
          build-args: |
            GOPROXY_ARG=https://proxy.golang.org,direct
            APK_MIRROR_ARG=