name: App

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".env.example"
      - "docker-compose*.yml"
      - "helm/**"
      - "config/**"
      - "migrations/**"
      - "scripts/**"
      - "skills/preloaded/**"
      - "docker/Dockerfile.app"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".env.example"
      - "docker-compose*.yml"
      - "helm/**"
      - "config/**"
      - "migrations/**"
      - "scripts/**"
      - "skills/preloaded/**"
      - "docker/Dockerfile.app"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server

  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: weknora_mysql_test_ci
          MYSQL_USER: weknora
          MYSQL_PASSWORD: weknora_ci
          MYSQL_ROOT_PASSWORD: weknora_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEKNORA_MYSQL_TEST_DSN: >-
        weknora:weknora_ci@tcp(127.0.0.1:3306)/weknora_mysql_test_ci?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      WEKNORA_MYSQL_MIGRATION_TEST_DSN: >-
        weknora:weknora_ci@tcp(127.0.0.1:3306)/weknora_mysql_test_ci?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run MySQL integration matrix
        shell: bash
        run: |
          go test -count=1 ./internal/database -run 'Test.*MySQL|TestMigration'
          go test -count=1 ./internal/application/repository -run 'Test.*MySQL'
          go test -count=1 ./internal/application/repository/retriever/mysql
          go test -count=1 ./internal/types -run 'TestGetVectorStoreTypes|TestVectorStore'
          go test -count=1 ./internal/container -run 'Test.*MySQL|Test.*Database|Test.*Engine'
          go test -count=1 ./internal/application/service -run 'Test.*MySQL'
