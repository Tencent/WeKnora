name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: weknora-ci-only
          POSTGRES_DB: weknora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weknora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server

      - name: PostgreSQL Wiki candidate regression
        env:
          WEKNORA_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=weknora-ci-only dbname=weknora_test sslmode=disable
          WEKNORA_REQUIRE_POSTGRES_TESTS: "1"
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Only the disposable service is initialized; no production DSN/secrets.
          docker exec "$POSTGRES_SERVICE_ID" psql -U postgres -d weknora_test \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          results="$RUNNER_TEMP/wiki-postgres-tests.jsonl"
          go test -count=1 -json ./internal/application/repository \
            -run '^TestFindSimilarPages_ExactAliasesPostgres$' | tee "$results"
          # go test also succeeds if a test is skipped or the selector matches none.
          # Require the actual named test to pass, not just a green package exit.
          jq -s -e '
            any(.[]; .Test == "TestFindSimilarPages_ExactAliasesPostgres" and .Action == "pass")
            and (all(.[]; .Action != "skip" and .Action != "fail"))
          ' "$results"
