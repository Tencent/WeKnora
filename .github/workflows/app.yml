name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "scripts/migrate.sh"
      - "scripts/check-migrate-secret-output.sh"
      - "skills/preloaded/**"
      - "testdata/**"
      - "dataset/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*licenses.sh"
      - "scripts/check-license-bundle.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "scripts/migrate.sh"
      - "scripts/check-migrate-secret-output.sh"
      - "skills/preloaded/**"
      - "testdata/**"
      - "dataset/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*licenses.sh"
      - "scripts/check-license-bundle.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "1"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Check migration credential logging
        shell: bash
        run: bash scripts/check-migrate-secret-output.sh

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: bash ./scripts/check-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet -tags sqlite_fts5 "${pkgs[@]}"
          go test -tags sqlite_fts5 "${pkgs[@]}"

      - name: Build server
        run: go build -tags sqlite_fts5 ./cmd/server

  postgres-contracts:
    name: PostgreSQL evaluation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: evaluation
          POSTGRES_PASSWORD: evaluation-test-only
          POSTGRES_DB: weknora_x03_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evaluation -d weknora_x03_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "1"
      REQUIRE_POSTGRES_TESTS: "1"
      TEST_POSTGRES_DSN: postgres://evaluation:evaluation-test-only@localhost:5432/weknora_x03_ci?sslmode=disable
      TEST_POSTGRES_MIGRATION_DSN: postgres://evaluation:evaluation-test-only@localhost:5432/weknora_x03_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run database contracts and reject skipped tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/database-contracts
          go test -json -count=1 -timeout=10m ./internal/application/repository -run Postgres > artifacts/database-contracts/repository.jsonl
          go test -tags sqlite_fts5 -json -count=1 -timeout=15m ./internal/database ./cmd/migrate-runner > artifacts/database-contracts/migrations.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          events = [json.loads(line)
                    for path in Path('artifacts/database-contracts').glob('*.jsonl')
                    for line in path.read_text().splitlines() if line.strip()]
          required = {
              'TestEvaluationTaskRepositoryPostgresContract',
              'TestEvaluationDatasetRepositoryPostgresContract',
              'TestModelPriceOverlapIsSerializedAcrossPostgresConnections',
              'TestPostgresMigrationsCreateAndRoundTripEvaluationSchema',
              'TestSQLiteEvaluationMigrationsRoundTrip',
              'TestMigrationBridgeSourceMatrix',
              'TestMigrationBridgeRejectsUnknownAndPartial',
              'TestMigrationBridgeResumeCommittedPhases',
              'TestMigrationBridgeReadOnlyAndStartupGate',
              'TestMigrationBridgeRequiresBackupIdentity',
              'TestMigrationBridgeCrossProcessLock',
              'TestMigrationBridgeAppendOnlyUpgrade',
              'TestMigrationBridgeSQLRollbackAndRecovery',
              'TestMigrationBridgeDatabaseWideLock',
              'TestSQLiteRuntimeRetrieverRestartAndSkillSchema',
              'TestSQLiteUnversionedRuntimeIsRejected',
              'TestPostgresIndexJSONSemanticComparison',
              'TestMigrationCommandExplicitTargetAndSecrets',
              'TestMigrationCommandSQLiteLifecycle',
          }
          passed = {event.get('Test') for event in events if event['Action'] == 'pass'}
          rejected = [event for event in events if event['Action'] in {'skip', 'fail'}]
          if rejected or required - passed:
              raise SystemExit(f'Database contract gate failed: skipped/failed={rejected}, missing={sorted(required - passed)}')
          print(f'Database contracts passed: {len(passed - {None})} tests, zero skips')
          PY

      - name: Upload database contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-contracts-${{ github.run_id }}
          path: artifacts/database-contracts/
          if-no-files-found: warn
