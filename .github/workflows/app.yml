name: App

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "scripts/**"
      - "skills/preloaded/**"
      - "docker/Dockerfile.app"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "scripts/**"
      - "skills/preloaded/**"
      - "docker/Dockerfile.app"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  backend-unit:
    name: Backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Run backend tests
        run: go test ./... -count=1

      - name: Build server
        run: go build ./cmd/server

  backend-vet:
    name: Backend vet and format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  backend-feedback-race:
    name: Backend feedback race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run focused feedback race tests
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/application/repository -run 'Feedback|ChunkDelete|HydrateMessagesRequiresAnActiveChunkReference|CompletionExcludesWebOnlyReferences|DeletingOneOfThreeReferences|DeletedReferencedChunk|LegacyReference' -count=1
          go test -race ./internal/application/service -run 'Feedback' -count=1
          go test -race ./internal/application/service/chat_pipeline -run 'PluginFilterTopK|FeedbackWeight|FeedbackWeighted' -count=1
          go test -race ./internal/application/feedbackweight -count=1
          go test -race ./internal/agent/tools -run 'Feedback' -count=1
          go test -race ./internal/router -run 'FeedbackRoutes' -count=1

  backend-postgres17:
    name: Backend PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: feedback-ci
          POSTGRES_DB: weknora_feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weknora_feedback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEKNORA_TEST_POSTGRES_DSN: postgres://postgres:feedback-ci@localhost:5432/weknora_feedback?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify native PostgreSQL fresh, upgrade, down, and up migrations
        run: >-
          go test ./internal/database
          -run '^TestChunkFeedbackPostgres'
          -count=1
          -v

      - name: Verify linearizable reset transactions
        run: >-
          go test ./internal/application/repository
          -run '^TestFeedbackPostgres'
          -count=1
          -v

      - name: Verify Agent feedback router-to-PostgreSQL integration
        run: >-
          go test ./internal/handler
          -run '^TestAgentFeedbackPostgresRouterIntegration$'
          -count=1
          -v

  backend-paradedb:
    name: Backend ParadeDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      paradedb:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: feedback-ci
          POSTGRES_DB: weknora_feedback
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weknora_feedback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEKNORA_TEST_PARADEDB_DSN: postgres://postgres:feedback-ci@localhost:5433/weknora_feedback?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify ParadeDB feedback schema and migration compatibility
        run: >-
          go test ./internal/database
          -run '^TestChunkFeedbackParadeDB'
          -count=1
          -v

      - name: Verify feedback repository compatibility on ParadeDB
        env:
          WEKNORA_TEST_POSTGRES_DSN: ${{ env.WEKNORA_TEST_PARADEDB_DSN }}
        run: >-
          go test ./internal/application/repository
          -run '^TestFeedbackPostgres'
          -count=1
          -v

      - name: Verify Agent feedback router compatibility on ParadeDB
        env:
          WEKNORA_TEST_POSTGRES_DSN: ${{ env.WEKNORA_TEST_PARADEDB_DSN }}
        run: >-
          go test ./internal/handler
          -run '^TestAgentFeedbackPostgresRouterIntegration$'
          -count=1
          -v

  migration-sqlite:
    name: SQLite migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify fresh, upgrade, down, up, and collision behavior
        run: >-
          go test ./internal/database
          -run '^TestChunkFeedback(SQLite|MigrationVersions)'
          -count=1
          -v

  mysql-schema-smoke:
    name: MySQL fresh-schema smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: feedback-ci
          MYSQL_DATABASE: weknora_feedback
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pfeedback-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEKNORA_TEST_MYSQL_DSN: root:feedback-ci@tcp(localhost:3306)/weknora_feedback?multiStatements=true&parseTime=true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify MySQL feedback schema
        run: >-
          go test ./internal/database
          -run '^TestChunkFeedbackMySQLFreshSchemaSmoke$'
          -count=1
          -v
