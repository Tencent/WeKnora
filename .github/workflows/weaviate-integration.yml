name: Weaviate Integration

# Runs the Weaviate retriever's integration tests against real Weaviate
# servers: the oldest version the retriever supports and the one
# docker-compose.yml ships. Only fires when the retriever, its dependencies or
# this file change.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/application/repository/retriever/weaviate/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/weaviate-integration.yml'
  push:
    branches: [main]
    paths:
      - 'internal/application/repository/retriever/weaviate/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/weaviate-integration.yml'

permissions:
  contents: read

concurrency:
  group: weaviate-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  integration:
    name: weaviate ${{ matrix.weaviate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum version the retriever accepts (see client.go).
          - weaviate: "1.33.18"
            workdir: ""
          # The version docker-compose.yml ships. Images built since 1.34.0
          # only find the gse dictionaries from this working directory.
          - weaviate: "1.40.5"
            workdir: "--workdir /go/pkg/mod"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start Weaviate ${{ matrix.weaviate }}
        run: |
          docker run -d --name weaviate ${{ matrix.workdir }} \
            -p 8080:8080 -p 50051:50051 \
            -e PERSISTENCE_DATA_PATH=/var/lib/weaviate \
            -e CLUSTER_HOSTNAME=node1 \
            -e DEFAULT_VECTORIZER_MODULE=none \
            -e ENABLE_MODULES=none \
            -e ENABLE_TOKENIZER_GSE=true \
            -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
            cr.weaviate.io/semitechnologies/weaviate:${{ matrix.weaviate }}
          for _ in $(seq 1 60); do
            if curl -sf localhost:8080/v1/.well-known/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs weaviate
          exit 1

      - name: Run integration tests
        env:
          WEAVIATE_INTEGRATION_HOST: localhost:8080
          WEAVIATE_INTEGRATION_GRPC: localhost:50051
        run: go test -count=1 -tags weaviate_integration ./internal/application/repository/retriever/weaviate/

      - name: Weaviate logs
        if: failure()
        run: docker logs weaviate
