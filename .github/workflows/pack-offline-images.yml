# 手动触发：从 ACR 拉取 linux/amd64 镜像并上传离线 tar 制品
name: Pack Offline Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. v0.8.20)"
        required: true
        default: "v0.8.20"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: registry.cn-beijing.aliyuncs.com
  IMAGE_NAMESPACE: gov-claw
  PLATFORM: linux/amd64

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull and save images
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p offline-images
          images=(
            "${REGISTRY}/${IMAGE_NAMESPACE}/tree-rag-ui:${TAG}"
            "${REGISTRY}/${IMAGE_NAMESPACE}/tree-rag-app:${TAG}"
            "${REGISTRY}/${IMAGE_NAMESPACE}/tree-rag-docreader:${TAG}"
            "paradedb/paradedb:v0.22.2-pg17"
            "redis:7.0-alpine"
          )
          : > offline-images/manifest.txt
          for image in "${images[@]}"; do
            echo "=== pull ${image} ==="
            docker pull --platform "${PLATFORM}" "${image}"
            safe="$(echo "${image}" | tr '/:' '__')"
            out="offline-images/${safe}.tar"
            echo "=== save ${out} ==="
            docker save -o "${out}" "${image}"
            echo "${image}  ${out}" >> offline-images/manifest.txt
            ls -lh "${out}"
          done
          tar -C offline-images -czf \
            "treerag-images-${TAG}-linux-amd64.tar.gz" .
          ls -lh "treerag-images-${TAG}-linux-amd64.tar.gz"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: treerag-offline-images-${{ inputs.version }}
          path: |
            offline-images/*.tar
            offline-images/manifest.txt
            treerag-images-${{ inputs.version }}-linux-amd64.tar.gz
          retention-days: 14
          compression-level: 0
