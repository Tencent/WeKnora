name: Evaluation regression

on:
  pull_request:
    paths:
      - 'cmd/evalgate/**'
      - 'cmd/cachebench/**'
      - 'evaluation/**'
      - 'frontend/src/api/evaluation/**'
      - 'frontend/src/views/settings/ModelSettings.vue'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'internal/config/config.go'
      - 'internal/config/model_observability_test.go'
      - 'internal/handler/evaluation*'
      - 'internal/application/service/evaluation*'
      - 'internal/application/service/model_call_recorder*'
      - 'internal/application/service/embedding_cache_persistence*'
      - 'internal/application/service/metric/**'
      - 'internal/application/service/chat_pipeline/**'
      - 'internal/application/service/knowledgebase_search*.go'
      - 'internal/models/chat/**'
      - 'internal/models/embedding/**'
      - 'internal/models/rerank/**'
      - 'internal/types/evaluation.go'
      - 'internal/types/llm_observability.go'
      - 'migrations/sqlite/000014_evaluation_model_calls*'
      - 'migrations/sqlite/000015_evaluation_model_call_cost*'
      - 'migrations/sqlite/000016_global_model_call_observability*'
      - 'migrations/sqlite/000018_model_call_types*'
      - 'migrations/sqlite/000019_embedding_cache_entries*'
      - 'migrations/versioned/000088_evaluation_model_calls*'
      - 'migrations/versioned/000089_evaluation_model_call_cost*'
      - 'migrations/versioned/000090_global_model_call_observability*'
      - 'migrations/versioned/000092_model_call_types*'
      - 'migrations/versioned/000093_embedding_cache_entries*'
      - '.env.example'
      - 'Makefile'
      - '.github/workflows/evaluation-regression.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test evaluation metrics and executable retrieval gate
        run: >-
          go test ./internal/application/service/metric
          ./internal/application/service/chat_pipeline
          ./internal/application/service
          ./internal/config
          ./internal/models/chat
          ./internal/models/embedding
          ./cmd/evalgate ./cmd/cachebench
      - name: Verify checked-in regression fixture
        run: >-
          go run ./cmd/evalgate
          -result evaluation/fixtures/regression_result.json
          -baseline evaluation/baseline.json
          -report evaluation-report.json
      - name: Prove a recall regression is rejected and identified
        shell: bash
        run: |
          if go run ./cmd/evalgate \
            -result evaluation/fixtures/regression_degraded.json \
            -baseline evaluation/baseline.json \
            -report evaluation-degraded-report.json; then
            echo "expected the degraded evaluation to fail" >&2
            exit 1
          fi
          grep -q '"path": "metric.retrieval_metrics.recall"' evaluation-degraded-report.json
          grep -A5 '"path": "metric.retrieval_metrics.recall"' evaluation-degraded-report.json | grep -q '"passed": false'
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-regression-report
          path: evaluation-report.json
          if-no-files-found: warn
      - name: Upload degradation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-degradation-proof
          path: evaluation-degraded-report.json
          if-no-files-found: warn
      - name: Verify cache comparison example
        run: >-
          go run ./cmd/cachebench
          -before evaluation/fixtures/cache_before.json
          -after evaluation/fixtures/cache_after.json
          -report cache-comparison.json
      - name: Upload cache comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-comparison-report
          path: cache-comparison.json
          if-no-files-found: warn

  model-usage-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check model usage page and API integration
        working-directory: frontend
        run: npm run type-check
