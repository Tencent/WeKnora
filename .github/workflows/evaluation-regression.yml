name: Evaluation regression

on:
  pull_request:
    paths:
      - 'cmd/evalgate/**'
      - 'cmd/cachebench/**'
      - 'cmd/evidenceverify/**'
      - 'cmd/retrievalgate/**'
      - 'evaluation/**'
      - 'frontend/src/api/evaluation/**'
      - 'frontend/src/api/model/modelUsage*'
      - 'frontend/src/components/ModelEditorDialog.vue'
      - 'frontend/src/utils/evaluation*'
      - 'frontend/src/views/settings/EvaluationSettings*'
      - 'frontend/src/views/settings/ModelSettings.vue'
      - 'frontend/src/views/settings/Settings.vue'
      - 'frontend/src/i18n/locales/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'internal/config/config.go'
      - 'internal/config/model_observability_test.go'
      - 'internal/handler/evaluation*'
      - 'internal/application/service/evaluation*'
      - 'internal/application/service/model_call_recorder*'
      - 'internal/application/service/embedding_cache_persistence*'
      - 'internal/application/service/metric/**'
      - 'internal/application/service/chat_pipeline/**'
      - 'internal/application/service/knowledgebase_search*.go'
      - 'internal/models/chat/**'
      - 'internal/models/embedding/**'
      - 'internal/models/rerank/**'
      - 'internal/types/evaluation.go'
      - 'internal/types/interfaces/evaluation.go'
      - 'internal/types/llm_observability.go'
      - 'migrations/sqlite/000014_evaluation_tasks*'
      - 'migrations/sqlite/000015_evaluation_model_calls*'
      - 'migrations/sqlite/000016_evaluation_model_call_cost*'
      - 'migrations/sqlite/000017_global_model_call_observability*'
      - 'migrations/sqlite/000018_evaluation_run_config*'
      - 'migrations/sqlite/000019_model_call_types*'
      - 'migrations/sqlite/000020_embedding_cache_entries*'
      - 'migrations/sqlite/000021_evaluation_usage_snapshot*'
      - 'migrations/sqlite/000022_embedding_cache_usage*'
      - 'migrations/sqlite/000023_model_call_request_fingerprint*'
      - 'migrations/versioned/000093_evaluation_tasks*'
      - 'migrations/versioned/000094_evaluation_model_calls*'
      - 'migrations/versioned/000095_evaluation_model_call_cost*'
      - 'migrations/versioned/000096_global_model_call_observability*'
      - 'migrations/versioned/000097_evaluation_run_config*'
      - 'migrations/versioned/000098_model_call_types*'
      - 'migrations/versioned/000099_embedding_cache_entries*'
      - 'migrations/versioned/000100_evaluation_usage_snapshot*'
      - 'migrations/versioned/000101_embedding_cache_usage*'
      - 'migrations/versioned/000102_model_call_request_fingerprint*'
      - '.env.example'
      - 'Makefile'
      - '.github/workflows/evaluation-regression.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test evaluation metrics and executable retrieval gate
        run: >-
          go test ./internal/application/service/metric
          ./internal/application/service/chat_pipeline
          ./internal/application/service
          ./internal/config
          ./internal/models/chat
          ./internal/models/embedding
          ./cmd/retrievalgate ./cmd/evalgate ./cmd/cachebench
      - name: Generate and gate production-pipeline result
        run: go run ./cmd/retrievalgate -out evaluation-pipeline-result.json
      - name: Verify generated production-pipeline result
        run: >-
          go run ./cmd/evalgate
          -result evaluation-pipeline-result.json
          -reference-result evaluation/fixtures/regression_reference.json
          -baseline evaluation/baseline.json
          -report evaluation-report.json
      - name: Prove a recall regression is rejected and identified
        shell: bash
        run: |
          if go run ./cmd/evalgate \
            -result evaluation/fixtures/regression_degraded.json \
            -reference-result evaluation/fixtures/regression_reference.json \
            -baseline evaluation/baseline.json \
            -report evaluation-degraded-report.json; then
            echo "expected the degraded evaluation to fail" >&2
            exit 1
          fi
          grep -q '"path": "metric.retrieval_metrics.recall"' evaluation-degraded-report.json
          grep -A8 '"path": "metric.retrieval_metrics.recall"' evaluation-degraded-report.json | grep -q '"passed": false'
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-regression-report
          path: evaluation-report.json
          if-no-files-found: warn
      - name: Upload degradation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-degradation-proof
          path: evaluation-degraded-report.json
          if-no-files-found: warn
      - name: Upload production-pipeline result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-production-pipeline-result
          path: evaluation-pipeline-result.json
          if-no-files-found: error
      - name: Verify cache comparison example
        run: >-
          go run ./cmd/cachebench
          -strict
          -before evaluation/fixtures/cache_before.json
          -after evaluation/fixtures/cache_after.json
          -report cache-comparison.json
      - name: Upload cache comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-comparison-report
          path: cache-comparison.json
          if-no-files-found: warn

  evaluation-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test evaluation and model usage UI
        working-directory: frontend
        run: npm test
      - name: Type-check and build evaluation UI
        working-directory: frontend
        run: npm run build-with-types
