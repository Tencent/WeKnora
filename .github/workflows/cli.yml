name: CLI

# Builds and tests the cli/ Go module on every push / PR that touches it.
# Foundation PR (PR-1) gates: 3-platform `go build` + `go test ./...` green.

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'client/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'client/**'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: cli
    # Windows default is PowerShell, which tokenizes `go test -coverprofile=coverage.out ./...`
    # in a way that detaches `.out` as a separate positional package arg.
    # Force bash everywhere so the run lines parse identically across platforms
    # (Git Bash is preinstalled on windows-latest runners).
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            cli/go.sum
            client/go.sum
      - name: Check client and changed cli Go formatting
        if: runner.os == 'Linux'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          unformatted_client=$(cd client && gofmt -l .)
          if [ -n "$unformatted_client" ]; then
            echo "The following client Go files are not gofmt-formatted:"
            echo "$unformatted_client"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          else
            diff_range=""
          fi
          if [ -n "$diff_range" ]; then
            unformatted_cli=$(
              git diff --name-only --diff-filter=ACMR -z "$diff_range" -- ':(glob)cli/**/*.go' |
                xargs -0 -r gofmt -l
            )
            if [ -n "$unformatted_cli" ]; then
              echo "The following cli Go files are not gofmt-formatted:"
              echo "$unformatted_cli"
              exit 1
            fi
          fi
      - name: client go build, vet, and test
        working-directory: client
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: go vet
        run: go vet ./...
      - name: Check agent-facing doc wire vocabulary
        if: runner.os == 'Linux'
        run: scripts/check-skill-wire-vocab.sh
      - name: Check for committed credentials in docs
        if: runner.os == 'Linux'
        run: scripts/check-secret-tokens.sh
      - name: coverage report
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out
