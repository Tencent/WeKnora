name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "examples/skills/presentation-builder/**"
      - "scripts/build_frontend_dist.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "examples/skills/presentation-builder/**"
      - "scripts/build_frontend_dist.sh"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Generate workbench preview fixtures
        run: |
          python -m pip install -r ../examples/skills/presentation-builder/requirements.txt
          sudo mkdir -p /workspace/output
          sudo chown "$(id -u):$(id -g)" /workspace /workspace/output
          rm -f /workspace/output/agent-workbench-demo.pptx
          python ../examples/skills/presentation-builder/scripts/build_presentation.py \
            --input ../examples/skills/presentation-builder/assets/sample.json \
            --output agent-workbench-demo.pptx
          mkdir -p "$RUNNER_TEMP/workbench-preview"
          cp /workspace/output/agent-workbench-demo.pptx "$RUNNER_TEMP/workbench-preview/"
          printf '%s\n' '<h1>Workbench report</h1><p>CI-generated isolated preview fixture.</p>' \
            > "$RUNNER_TEMP/workbench-preview/workbench-report.html"
          printf '%s\n' 'Backend,Status' 'Docker,Ready' 'E2B,Ready' \
            > "$RUNNER_TEMP/workbench-preview/backend-summary.csv"

      - name: Run workbench browser security checks
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/weknora-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          PREVIEW_ARTIFACT_DIR="$RUNNER_TEMP/workbench-preview" npm run test:workbench-browser

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-image:
    name: Docker multi-stage image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build UI image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_FRONTEND_COMMIT="${GITHUB_SHA::7}" \
            -t weknora-ui:ci \
            frontend/
