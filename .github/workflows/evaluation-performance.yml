name: Evaluation performance

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  LOG_FORMAT: ""

jobs:
  benchmark:
    name: Isolated evaluation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the performance matrix
        run: make evaluation-benchmark

      - name: Upload authoritative and rendered reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-performance-${{ github.run_id }}
          path: artifacts/evaluation-performance/
          if-no-files-found: error
