# This overlay uses the Compose !override tag (Docker Compose 2.24.4+).
# It is intentionally deterministic: values from a PostgreSQL-oriented .env
# cannot switch the main database or retriever back to PostgreSQL.
# As with the base Compose workflow documented in the README, create .env from
# .env.example before rendering or starting the stack.
services:
  app:
    volumes:
      # This directory is empty by default. For DB_USE_TLS=true, mount the
      # provider CA and optional client certificate/key here; it is read-only.
      - ${DB_TLS_MOUNT_DIR:-./config/mysql-tls}:/run/secrets/weknora-mysql:ro
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-weknora}
      - DB_PASSWORD=${DB_PASSWORD:-weknora123!@#}
      - DB_NAME=${DB_NAME:-WeKnora}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-20}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-10}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-10m}
      - DB_CONN_MAX_IDLE_TIME=${DB_CONN_MAX_IDLE_TIME:-5m}
      - DB_USE_TLS=${DB_USE_TLS:-false}
      - DB_TLS_SERVER_NAME=${DB_TLS_SERVER_NAME:-}
      - DB_TLS_CA=${DB_TLS_CA:-}
      - DB_TLS_CERT=${DB_TLS_CERT:-}
      - DB_TLS_KEY=${DB_TLS_KEY:-}
      - DB_TLS_INSECURE_SKIP_VERIFY=${DB_TLS_INSECURE_SKIP_VERIFY:-false}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10s}
      - DB_READ_TIMEOUT=${DB_READ_TIMEOUT:-}
      - DB_WRITE_TIMEOUT=${DB_WRITE_TIMEOUT:-}
      - AUTO_RECOVER_DIRTY=false
      - RETRIEVE_DRIVER=${MYSQL_RETRIEVE_DRIVER:-mysql}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=${DB_USER:-weknora}
      - MYSQL_PASSWORD=${DB_PASSWORD:-weknora123!@#}
      - MYSQL_DATABASE=${DB_NAME:-WeKnora}
      - MYSQL_TABLE_PREFIX=${MYSQL_TABLE_PREFIX:-weknora_embeddings}
      - MYSQL_USE_TLS=${MYSQL_USE_TLS:-${DB_USE_TLS:-false}}
      - MYSQL_TLS_SERVER_NAME=${MYSQL_TLS_SERVER_NAME:-${DB_TLS_SERVER_NAME:-}}
      - MYSQL_TLS_CA=${MYSQL_TLS_CA:-${DB_TLS_CA:-}}
      - MYSQL_TLS_CERT=${MYSQL_TLS_CERT:-${DB_TLS_CERT:-}}
      - MYSQL_TLS_KEY=${MYSQL_TLS_KEY:-${DB_TLS_KEY:-}}
      - MYSQL_TLS_INSECURE_SKIP_VERIFY=${MYSQL_TLS_INSECURE_SKIP_VERIFY:-${DB_TLS_INSECURE_SKIP_VERIFY:-false}}
      - MYSQL_CONNECT_TIMEOUT=${MYSQL_CONNECT_TIMEOUT:-${DB_CONNECT_TIMEOUT:-10s}}
      - MYSQL_READ_TIMEOUT=${MYSQL_READ_TIMEOUT:-${DB_READ_TIMEOUT:-}}
      - MYSQL_WRITE_TIMEOUT=${MYSQL_WRITE_TIMEOUT:-${DB_WRITE_TIMEOUT:-}}
    depends_on: !override
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      docreader:
        condition: service_healthy

  # Keep PostgreSQL available only for the optional Langfuse profile, whose
  # upstream stack still requires it. It is not started by the MySQL default.
  postgres:
    profiles:
      - langfuse
      - full

  mysql:
    image: mysql:8.4
    container_name: WeKnora-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ngram-token-size=2
      - --default-time-zone=+00:00
    environment:
      - MYSQL_DATABASE=${DB_NAME:-WeKnora}
      - MYSQL_USER=${DB_USER:-weknora}
      - MYSQL_PASSWORD=${DB_PASSWORD:-weknora123!@#}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123!@#}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - WeKnora-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
