services:
  app:
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - RETRIEVE_DRIVER=${MYSQL_RETRIEVE_DRIVER:-qdrant}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6334}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: WeKnora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-weknora_root}
      MYSQL_DATABASE: ${DB_NAME:-WeKnora}
      MYSQL_USER: ${DB_USER:-weknora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-weknora}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - WeKnora-network
    restart: unless-stopped

  # The base Compose keeps PostgreSQL unprofiled for backward compatibility.
  # In this override it is opt-in, so the documented MySQL command neither
  # starts nor waits for the business PostgreSQL service.
  postgres:
    profiles:
      - postgres-primary

volumes:
  mysql-data:
