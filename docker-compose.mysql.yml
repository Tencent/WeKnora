services:
  app:
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USERNAME:-root}
      - DB_PASSWORD=${MYSQL_PASSWORD:-${DB_PASSWORD}}
      - DB_NAME=${MYSQL_DATABASE:-${DB_NAME:-weknora}}
      - RETRIEVE_DRIVER=mysql
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      docreader:
        condition: service_healthy

  mysql:
    profiles: ["mysql"]

  postgres:
    profiles: ["postgres"]
