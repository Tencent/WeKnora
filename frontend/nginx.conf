# Optional dedicated embed origin — uncomment and set server_name (e.g. embed.example.com).
# Serve only embed.html + static assets; proxy /api to the WeKnora backend.
# See docs/embed-subdomain.md
#
# server {
#     listen 80;
#     server_name embed.example.com;
#     client_max_body_size ${MAX_FILE_SIZE};
#     location = /weknora-widget.js { root /usr/share/nginx/html; }
#     location ^~ /embed/ { root /usr/share/nginx/html; try_files $uri $uri/ /embed.html; }
#     location ^~ /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; }
#     location /api/ { proxy_pass http://weknora-backend:8080; proxy_set_header Host $host; }
# }

server {
    listen 80;
    server_name localhost;
    # Default 50M, configured via MAX_FILE_SIZE_MB env var
    client_max_body_size ${MAX_FILE_SIZE};

    # 启用 gzip 压缩静态资源 (前端 index.js 单文件 ~1MB, 不压实测 20s+,
    # 压缩后约 200-300KB, 大陆同地域低带宽机器加载从 25s 降到 3-5s)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 错误日志配置
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Static widget loader for third-party sites
    location = /weknora-widget.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal fallback target for /embed/* routes. Keep it separate from the
    # main SPA location so embed pages do not inherit X-Frame-Options.
    location = /embed.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Embed widget pages may be loaded inside third-party iframes (lightweight embed.html)
    location ^~ /embed/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /embed.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 及 SPA fallback 不可缓存，否则前端升级后用户看不到新版本
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header 不从上层继承，需要在 location 内重复声明安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite 构建产物 /assets/* 带 hash 文件名，可长期缓存
    location ^~ /assets/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 本地存储文件代理到后端服务（用于渲染 markdown 中的图片）
    # 精确匹配 /files，避免 Nginx 自动补 / 触发 301
    location = /files {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 资源能力短链 /r/<token>：IM 渠道渲染 resource:// 图片依赖此路由，
    # 缺此段会落进 SPA fallback 返回空白页，图片加载不出来。
    location ^~ /r/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # custom-backend 服务代理（vidsage 项目业务 API）
    # 必须放在 /api/ 之前，nginx 最长前缀匹配让 /api/custom/* 命中此段
    # 不加这段会让 /api/custom/* 被 L117 的 /api/ 兜底代理到 WeKnora app:8080，
    # 触发 app 的 auth 中间件返回 401 "Unauthorized: missing authentication"。
    #
    # 关键变更（2026-08-25）：将 proxy_buffering 从 off 改为 on
    # 原 off 会按 ~1.9KB 分包流式回传，公网到客户端链路对第二个及后续包存在
    # 偶发丢包时，客户端永远等 TCP 重传失败到超时（公网症状：列表/详情接口
    # 永远卡 15-60s 才拿到 1910B 截断响应）。改为 on 后 nginx 把整个响应缓冲
    # 在内存里（5KB~500KB 都没问题），再一次性回传，规避公网链路敏感度。
    # 注意：proxy_request_buffering 保持 off 让大文件 PUT 请求体不被 nginx
    # 缓存到磁盘，避免吃 2GB 内存/磁盘；二者互不影响。
    location /api/custom/ {
        proxy_pass http://vidsage-custom-backend:8090/api/custom/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大文件配置（2GB 视频）
        client_max_body_size 2G;
        proxy_request_buffering off;  # 请求体不落 nginx 缓存，避免吃内存
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 响应体缓冲后再回传，修复公网链路丢包导致的客户端卡死
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 保留标准 HTTP/1.1 响应边界，避免浏览器只能等待连接关闭判断响应结束
        chunked_transfer_encoding on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_cache off;
    }

    # SSE 流式接口（聊天逐字输出）单独保留无缓冲配置，否则流式会被 nginx 缓冲
    # 造成"打字机效果卡死，一次性全量吐回"。Nginx 正则 location 优先级高于普通前缀，
    # 故 knowledge-chat/agent-chat/embed 流式路径命中此处，其余 /api/* 落入下方缓冲段。
    # 若官方 WeKnora 后续新增其他 SSE 路径，同步追加到下面两条 regex 中。
    location ~* ^/api/v1/(knowledge-chat|agent-chat)/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接和重试配置（与原 /api/ 段一致）
        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # SSE 流式：无缓冲 + 持久连接，允许浏览器逐字渲染
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~* ^/api/v1/embed/.+/(agent-chat|knowledge-chat)$ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # SSE 流式：第三方嵌入页面同样需要无缓冲逐字输出
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API请求代理到后端服务（非流式的普通接口统一走缓冲模式）
    # APP_SCHEME 默认 http，远程 HTTPS 后端可设为 https
    #
    # 关键变更（2026-08-27）：将 proxy_buffering 从 off 改为 on，chunked_transfer_encoding
    # 从 off 改为 on，与 /api/custom/ 段（2026-08-25 修复）保持一致。
    # 原 off 组合导致：上游以 Transfer-Encoding: chunked 返回的接口（如 GET /api/v1/models，
    # 响应体≈3585B）被 Nginx 既不能透传 chunked，也不能缓冲后补 Content-Length，只能回退
    # 到 Connection: close 表示响应结束。公网链路第二个及后续 TCP 段一旦有丢包/乱序，浏览器
    # 无法明确响应边界，判定 net::ERR_ABORTED，模型列表/知识库模型选择等页面报"网络错误"。
    # 改为 on 后 nginx 把响应缓冲完再一次性回传（响应头带明确 Content-Length），规避公网链路
    # 敏感度；SSE 流式接口由上方两条 regex location 单独保留 off，不影响聊天打字机效果。
    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接和重试配置（保留原策略）
        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # 响应体缓冲后再回传，修复公网链路丢包导致的 ERR_ABORTED
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
