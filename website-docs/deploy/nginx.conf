server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /docs { return 308 /docs/; }
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }
    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }
}
