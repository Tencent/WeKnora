[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "weknora-plugin"
version = "0.1.0"
description = "Build WeKnora code plugins in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WeKnora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Tencent/WeKnora/tree/main/pluginsdk/python"

[tool.setuptools.packages.find]
where = ["src"]
