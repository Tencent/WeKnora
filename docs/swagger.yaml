  types.AgentStep:
    properties:
      intermediate_answer:
        description: |-
          IntermediateAnswer preserves a plain answer followed by a loop-end steer.
          The canonical final answer is still stored in Message.Content.
        type: boolean
      iteration:
        description: Iteration number (0-indexed)
        type: integer
      reasoning_content:
        description: |-
          ReasoningContent stores the OpenAI-protocol reasoning_content emitted by the
          model in this round. Persisted on AgentStep so cross-turn replay can put it
          back on the assistant message — required by MiMo / DeepSeek V3.2+ thinking
          mode, ignored by providers that don't recognize the field.
        type: string
      reasoning_metadata:
        $ref: '#/definitions/types.ProviderMetadata'
      reasoning_signature:
        description: |-
          ReasoningSignature / ReasoningMetadata are the provider artifacts that
          must accompany ReasoningContent on replay (Anthropic signatures,
          OpenAI Responses encrypted reasoning items).
        type: string
      thought:
        description: LLM's reasoning/thinking (Think phase)
        type: string
      timestamp:
        description: When this step occurred
        type: string
      tool_calls:
        description: Tools called in this step (Act phase)
        items:
          $ref: '#/definitions/types.ToolCall'
        type: array
      truncated:
        description: |-
          Truncated marks the round the completion-token cap cut off. It rides in
          the agent_steps JSON so a reloaded, shared or re-opened conversation can
          still show that the answer stops mid-sentence by design, rather than
          looking finished. Live streaming carries the same fact on the answer
          event; this is what survives the round trip.
        type: boolean
      user_messages_before:
        description: |-
          UserMessagesBefore records consumed steer rows in delivery order, before
          this model response. Unlike timestamps, this remains unambiguous on replay.
        items:
          type: string
        type: array
    type: object
  types.AuditLog:
    properties:
      action:
        type: string
      actor_role:
        type: string
      actor_user_id:
        type: string
      created_at:
        type: string
      details:
        items:
          type: integer
        type: array
      id:
        type: integer
      outcome:
        type: string
      request_method:
        type: string
      request_path:
        type: string
      scope_id:
        type: string
      scope_type:
        type: string
      target_id:
        type: string
      target_type:
        type: string
      target_user_id:
        type: string
      tenant_id:
        type: integer
    type: object
  types.AutoTagConfig:
    properties:
      enabled:
        type: boolean
      max_tags:
        type: integer
      model_id:
        type: string
      skip_if_tagged:
        description: |-
          SkipIfTagged leaves documents that already carry tags untouched, so a
          deliberate manual classification is not diluted by model guesses. It is
          a pointer because the default is true: rows written before this field
          existed decode to nil and must not silently flip to "always append".
        type: boolean
    type: object
  types.COSEngineConfig:
    properties:
      app_id:
        type: string
      bucket_name:
        type: string
      path_prefix:
        type: string
      region:
        type: string
      secret_id:
        type: string
      secret_key:
        type: string
      temp_bucket_name:
        type: string
      temp_region:
        type: string
    type: object
  types.ChatHistoryConfig:
    properties:
      embedding_model_id:
        description: |-
          EmbeddingModelID is the ID of the embedding model used for vectorizing chat messages.
          Once messages have been indexed, the model cannot be changed (requires re-indexing).
        type: string
      enabled:
        description: Enabled controls whether chat history indexing is active
        type: boolean
      knowledge_base_id:
        description: |-
          KnowledgeBaseID is the auto-managed hidden knowledge base for chat history.
          This is set internally when the feature is first enabled; users should not set this directly.
        type: string
    type: object
  types.ChunkingConfig:
    properties:
      child_chunk_size:
        description: |-
          ChildChunkSize is the size of child chunks used for embedding (default: 384).
          Only used when EnableParentChild is true.
        type: integer
      chunk_overlap:
        description: Chunk overlap
        type: integer
      chunk_size:
        description: Chunk size
        type: integer
      enable_parent_child:
        description: |-
          EnableParentChild enables two-level parent-child chunking strategy.
          When enabled, large parent chunks provide context while small child chunks
          are used for vector matching. Retrieval matches on child but returns parent content.
        type: boolean
      languages:
        description: |-
          Languages hints the heuristic patterns. Empty = auto-detect from content.
          Examples: ["de"], ["en", "zh"].
        items:
          type: string
        type: array
      parent_chunk_size:
        description: |-
          ParentChunkSize is the size of parent chunks (default: 4096).
          Only used when EnableParentChild is true.
        type: integer
      parser_engine_rules:
        description: |-
          ParserEngineRules configures which parser engine to use for each file type.
          When empty, DefaultParserEngine is used (builtin/simple routing, except
          types that only a specific engine can parse: ppt/pptx fall back to
          markitdown). A linked anydoc binding is preferred for every type it
          converts.
        items:
          $ref: '#/definitions/types.ParserEngineRule'
        type: array
      separators:
        description: Separators
        items:
          type: string
        type: array
      strategy:
        description: |-
          Strategy selects the adaptive chunking tier. Empty / "legacy" preserves
          the historical recursive splitter; "auto" lets a profiler pick between
          heading-aware, heuristic and recursive tiers; "heading" / "heuristic" /
          "recursive" pin the tier explicitly.
        type: string
      table_metadata_instructions:
        description: |-
          TableMetadataInstructions contains optional business guidance used when
          generating searchable summaries for CSV/Excel tables. The system-owned
          output contract remains fixed; these instructions only add domain context.
        type: string
      token_limit:
        description: |-
          TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize
          as a character count.
        type: integer
    type: object
  types.ConnectionConfig:
    properties:
      addr:
        description: Common
        type: string
      api_key:
        description: AES-GCM encrypted
        type: string
      database:
        description: |-
          Database name used by engines that support database-level namespaces
          (currently Milvus, Tencent VectorDB, and Doris).
        type: string
      grpc_address:
        description: Weaviate
        type: string
      host:
        description: Qdrant
        type: string
      http_port:
        description: |-
          Doris: HTTP port for Stream Load API (FE default 8030).
          Addr is reused for the MySQL protocol "host:9030"; HTTPPort + the host of Addr
          together form the FE HTTP endpoint used by Stream Load.
        type: integer
      insecure_skip_verify:
        description: |-
          InsecureSkipVerify disables TLS certificate verification when
          talking to the backing store over HTTPS. Defaults to false
          (secure). Set to true ONLY for self-signed development clusters;
          production deployments should provide trusted certificates via
          the system CA pool. Cross-driver applicable but currently only
          the OpenSearch driver (Phase 3) reads this field. Note: this
          differs from the Qdrant-specific UseTLS below, which *enables*
          TLS on gRPC connections — InsecureSkipVerify only controls
          *verification* of an already-TLS connection.
        type: boolean
      password:
        description: AES-GCM encrypted
        type: string
      port:
        type: integer
      scheme:
        type: string
      use_default_connection:
        description: Postgres
        type: boolean
      use_tls:
        type: boolean
      username:
        type: string
      version:
        description: |-
          Version is the detected server version (e.g., "7.10.1", "16.2", "1.12.6").
          Auto-populated by TestConnection on successful connectivity check.
        type: string
    type: object
  types.ContextConfig:
    properties:
      compression_strategy:
        description: 'Compression strategy: "sliding_window" or "smart"'
        type: string
      max_tokens:
        description: Maximum tokens allowed in LLM context
        type: integer
      recent_message_count:
        description: |-
          For sliding_window: number of messages to keep
          For smart: number of recent messages to keep uncompressed
        type: integer
      summarize_threshold:
        description: 'Summarize threshold: number of messages before summarization'
        type: integer
    type: object
  types.CreateOrganizationRequest:
    properties:
      avatar:
        description: optional avatar URL
        maxLength: 512
        type: string
      description:
        maxLength: 1000
        type: string
      invite_code_validity_days:
        description: 'optional: 0=never, 1, 7, 30; default 7'
        type: integer
      member_limit:
        description: 'optional: max members; 0=unlimited; default 50'
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  types.CredentialsConfig:
    properties:
      weknoracloud:
        $ref: '#/definitions/types.WeKnoraCloudCredentials'
    type: object
  types.CubeEgressRule:
    properties:
      audit:
        description: Audit is none | metadata | full. Empty uses the server default.
        type: string
      deny:
        description: |-
          Deny inverts the action, which defaults to allow. A deny rule still
          needs Host or SNI: the target has to reach CubeEgress for it to answer
          with a request-level 403 instead of the network layer dropping it.
        type: boolean
      host:
        type: string
      inject:
        description: Inject adds credential headers on allowed HTTPS requests.
        items:
          $ref: '#/definitions/types.CubeHeaderInject'
        type: array
      methods:
        items:
          type: string
        type: array
      name:
        type: string
      path:
        type: string
      scheme:
        type: string
      sni:
        type: string
    type: object
  types.CubeHeaderInject:
    properties:
      format:
        type: string
      header:
        type: string
      secret:
        type: string
    type: object
  types.CubeSandboxConfig:
    properties:
      api_key:
        description: 加密
        type: string
      api_url:
        type: string
      cube_sandbox_ttl_seconds:
        type: integer
      dns_servers:
        description: DNSServers are Cube template nameserver IPs. Empty uses Cubelet's
          default.
        items:
          type: string
        type: array
      http_timeout_sec:
        description: |-
          HTTPTimeoutSec bounds each HTTP call to the sandbox control plane.
          0 means use the built-in default (30s), never the deployment's value.
        type: integer
      proxy_url:
        type: string
      sandbox_domain:
        type: string
      template_id:
        type: string
    type: object
  types.CustomAgentConfig:
    properties:
      agent_mode:
        description: |-
          ===== Basic Settings =====
          Agent mode: "quick-answer" for RAG mode, "smart-reasoning" for ReAct agent mode
        type: string
      agent_type:
        description: |-
          AgentType is a preset category under smart-reasoning mode that pre-fills
          system prompt, allowed tools and recommended KB compatibility.
          Valid values: "rag-qa", "wiki-qa", "hybrid-rag-wiki", "custom".
          Empty / unknown values are treated as "custom" (no preset applied).
          Ignored for quick-answer mode.
        type: string
      allowed_tools:
        description: Allowed tools (only for agent type)
        items:
          type: string
        type: array
      asr_model_id:
        description: ASR model ID for audio transcription (optional)
        type: string
      attachment_image_understanding:
        description: |-
          AttachmentImageUnderstanding enables VLM OCR fallback for image-only /
          scanned documents (PDF/PPT whose pages are images). Disabled by default
          because it materially increases parse latency; only triggers when the
          extracted text is below a threshold and a VLM model is configured.
        type: boolean
      attachment_ocr_max_pages:
        description: |-
          AttachmentOCRMaxPages caps how many pages of a scanned / image-only
          document this agent sends to the VLM for OCR. 0 falls back to the global
          default (WEKNORA_CHAT_ATTACHMENT_OCR_MAX_PAGES). More pages means higher
          coverage but slower parsing and more VLM cost.
        type: integer
      attachment_parse_wait_timeout_sec:
        description: |-
          AttachmentParseWaitTimeoutSec bounds, in seconds, how long a chat turn
          waits for this agent's still-parsing attachments before proceeding with
          only the finished ones. 0 falls back to the global default
          (WEKNORA_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC).
        type: integer
      audio_upload_enabled:
        description: 'Whether audio upload (ASR transcription) is enabled for this
          agent (default: false)'
        type: boolean
      chat_parser_engine_rules:
        description: |-
          ===== Chat Attachment Parsing Settings =====
          ChatParserEngineRules selects parser engines for session-scoped chat
          attachments by file type. Takes precedence over the tenant-level
          ParserEngineConfig.ChatParserEngineRules; an explicit per-request
          parser_engine still overrides both.
        items:
          $ref: '#/definitions/types.ParserEngineRule'
        type: array
      citation_enabled:
        description: |-
          Whether final answers include knowledge/web source citations. Nil defaults to true
          so agents saved before this option was introduced keep their existing behavior.
        type: boolean
      context_template:
        description: Context template for normal mode (how to format retrieved chunks)
        type: string
      context_template_id:
        description: |-
          ContextTemplateID references a template ID in prompt_templates/ YAML files.
          If set and ContextTemplate is empty, the template content is resolved at request time for saved agents.
        type: string
      data_analysis_enabled:
        description: |-
          ===== Data Analysis Settings =====
          Whether to run the legacy in-pipeline DuckDB SQL data-analysis stage when
          the retrieved chunks include CSV/Excel files. This issues an extra LLM
          call to generate a SQL query and is disabled by default because most
          quick-answer / RAG-style agents do not want the added latency.
        type: boolean
      embedding_top_k:
        description: |-
          ===== Retrieval Strategy Settings (for both modes) =====
          Embedding/Vector retrieval top K
        type: integer
      enable_query_expansion:
        description: |-
          ===== Advanced Settings (mainly for normal mode) =====
          Whether to enable query expansion
        type: boolean
      enable_rewrite:
        description: Whether to enable query rewrite for multi-turn conversations
        type: boolean
      fallback_prompt:
        description: Fallback prompt (when FallbackStrategy is "model")
        type: string
      fallback_response:
        description: Fixed fallback response (when FallbackStrategy is "fixed")
        type: string
      fallback_strategy:
        description: 'Fallback strategy: "fixed" for fixed response, "model" for model
          generation'
        type: string
      faq_direct_answer_threshold:
        description: FAQ direct answer threshold - if similarity > this value, use
          FAQ answer directly
        type: number
      faq_priority_enabled:
        description: |-
          ===== FAQ Strategy Settings =====
          Whether FAQ priority strategy is enabled (FAQ answers prioritized over document chunks)
        type: boolean
      faq_score_boost:
        description: FAQ score boost multiplier - FAQ results score multiplied by
          this factor
        type: number
      history_turns:
        description: Number of history turns to keep in context. Quick-answer only;
          smart-reasoning sizes history by context window
        type: integer
      image_storage_provider:
        description: |-
          Storage provider for image uploads: "local", "minio", "cos", "tos", "s3", "oss", "ks3".
          Empty means use the global/workspace default provider.
        type: string
      image_upload_enabled:
        description: |-
          ===== Image Upload / Multimodal Settings =====
          Whether image upload is enabled for this agent (default: false)
        type: boolean
      intent_prompts:
        additionalProperties:
          type: string
        description: |-
          IntentPrompts holds per-intent system prompt overrides for non-retrieval
          intents (greeting, chitchat, etc.). Empty values fall back to templates
          under config/prompt_templates/intent_prompts.yaml.
        type: object
      kb_selection_mode:
        description: |-
          ===== Knowledge Base Settings =====
          Knowledge base selection mode: "all" = all KBs, "selected" = specific KBs, "none" = no KB
        type: string
      keyword_threshold:
        description: Keyword retrieval threshold
        type: number
      knowledge_bases:
        description: Associated knowledge base IDs (only used when KBSelectionMode
          is "selected")
        items:
          type: string
        type: array
      llm_call_timeout:
        description: Timeout for a single LLM call in seconds (0 = use global default)
        type: integer
      max_completion_tokens:
        description: |-
          Maximum completion tokens. Quick-answer uses this for the RAG answer.
          Smart-reasoning ReAct rounds send this value as-is (zero becomes
          DefaultMaxCompletionTokens at call time: 4096, or 24576 with a sandbox).
        type: integer
      max_iterations:
        description: |-
          ===== Agent Mode Settings =====
          Maximum iterations for the ReAct loop. Zero is unset (filled with a
          default). A negative value is unlimited: the loop runs until the model
          stops, the user cancels, or another guard fires.
        type: integer
      mcp_auth_wait_timeout:
        description: |-
          MCPAuthWaitTimeout is how many seconds to wait for in-conversation OAuth
          authorization before skipping. <=0 uses the gate's configured timeout.
        type: integer
      mcp_selection_mode:
        description: 'MCP service selection mode: "all" = all enabled MCP services,
          "selected" = specific services, "none" = no MCP'
        type: string
      mcp_services:
        description: Selected MCP service IDs (only used when MCPSelectionMode is
          "selected")
        items:
          type: string
        type: array
      memory_enabled:
        description: |-
          Whether this agent may read the user's long-term memory. Nil inherits
          the workspace setting; false opts a single agent out of memory even when
          the workspace has it on. There is no "on" that overrides the workspace.
        type: boolean
      model_id:
        description: |-
          ===== Model Settings =====
          Model ID to use for conversations
        type: string
      multi_turn_enabled:
        description: |-
          ===== Multi-turn Conversation Settings =====
          Whether multi-turn conversation is enabled
        type: boolean
      query_understand_model_id:
        description: |-
          Dedicated chat model ID for the query-understanding (rewrite + intent) step.
          When empty, the main conversation ModelID is used as a fallback.
        type: string
      question_suggestions:
        allOf:
        - $ref: '#/definitions/types.QuestionSuggestionConfig'
        description: |-
          ===== Conversation Question Suggestions =====
          QuestionSuggestions owns both the static/knowledge-backed prompts shown
          before the first user turn and the contextual follow-up questions shown
          after a completed assistant answer.
      reasoning_effort:
        description: |-
          ReasoningEffort selects the thinking intensity (off | auto | minimal |
          low | medium | high | xhigh | max). Empty keeps the boolean Thinking
          semantics: true means "auto". See internal/models/api.ReasoningEffort.
        type: string
      rerank_model_id:
        description: ReRank model ID for retrieval
        type: string
      rerank_threshold:
        description: Rerank threshold
        type: number
      rerank_top_k:
        description: Rerank top K
        type: integer
      retain_retrieval_history:
        description: Whether to retain retrieval history across turns
        type: boolean
      retrieve_kb_only_when_mentioned:
        description: |-
          Whether to retrieve knowledge base only when explicitly mentioned with @ (default: false)
          When true, knowledge base retrieval only happens if user explicitly mentions KB/files with @
          When false, knowledge base retrieval happens according to KBSelectionMode
        type: boolean
      rewrite_prompt_system:
        description: Rewrite prompt system message
        type: string
      rewrite_prompt_user:
        description: Rewrite prompt user message template
        type: string
      sandbox_config_id:
        description: |-
          ===== Sandbox Settings =====
          SandboxConfigID selects which workspace sandbox config this agent's
          skill scripts run on. Empty means sandbox execution is disabled.

          This references the LOGICAL config, never a specific revision: keeping
          the indirection here is what would let credential rotation happen
          without re-pointing every agent (see the spec's §4.8).
        type: string
      selected_skills:
        description: Selected skill names (only used when SkillsSelectionMode is "selected")
        items:
          type: string
        type: array
      skills_selection_mode:
        description: |-
          ===== Skills Settings (only for smart-reasoning mode) =====
          Skills selection mode: "all" = all installed skills, "selected" = specific skills, "none" = no skills
        type: string
      supported_file_types:
        description: |-
          ===== File Type Restriction Settings =====
          Supported file types for this agent (e.g., ["csv", "xlsx", "xls"])
          Empty means all file types are supported
          When set, only files with matching extensions can be used with this agent
        items:
          type: string
        type: array
      system_prompt:
        description: System prompt for the agent (unified prompt, uses web_search_status
          placeholder for dynamic behavior)
        type: string
      system_prompt_id:
        description: |-
          SystemPromptID references a template ID in prompt_templates/ YAML files.
          If set and SystemPrompt is empty, the template content is resolved at request time for saved agents.
        type: string
      temperature:
        description: Temperature for LLM (0-1)
        type: number
      thinking:
        description: Whether to enable thinking mode (for models that support extended
          thinking)
        type: boolean
      vector_threshold:
        description: Vector retrieval threshold
        type: number
      vlm_model_id:
        description: VLM model ID for image analysis (optional, falls back to workspace-level
          VLM)
        type: string
      web_fetch_enabled:
        description: Whether to auto-fetch full page content for reranked web search
          results
        type: boolean
      web_fetch_top_n:
        description: 'Max number of pages to fetch after rerank (default: 3)'
        type: integer
      web_search_enabled:
        description: |-
          ===== Web Search Settings =====
          Whether web search is enabled
        type: boolean
      web_search_max_results:
        description: Maximum web search results
        type: integer
      web_search_provider_id:
        description: |-
          WebSearchProviderID references a specific WebSearchProviderEntity.
          If empty, the workspace's default provider (is_default=true) is used.
        type: string
    type: object
  types.DataSource:
    properties:
      config:
        description: |-
          Encrypted configuration (API credentials, tokens, etc.)
          Stored as JSON with AES-256-GCM encryption
        items:
          type: integer
        type: array
      conflict_strategy:
        description: 'Conflict resolution strategy: overwrite or skip'
        type: string
      created_at:
        description: Creation timestamp
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Soft delete timestamp
      error_message:
        description: Error message if status is "error"
        type: string
      id:
        description: Unique identifier
        type: string
      knowledge_base_id:
        description: Target knowledge base ID
        type: string
      last_sync_at:
        description: Last successful sync timestamp
        type: string
      last_sync_cursor:
        description: Cursor or state for incremental sync (connector-specific)
        items:
          type: integer
        type: array
      last_sync_result:
        description: Summary of last sync result
        items:
          type: integer
        type: array
      latest_sync_log:
        allOf:
        - $ref: '#/definitions/types.SyncLog'
        description: Latest sync log (not stored in DB, populated on query)
      name:
        description: User-friendly name
        type: string
      status:
        description: 'Current status: active, paused, error'
        type: string
      sync_deletions:
        description: Whether to sync deletions from source
        type: boolean
      sync_log_retention_days:
        description: 'Number of days to keep sync logs (default: 30)'
        type: integer
      sync_mode:
        description: 'Sync mode: "incremental" (recommended) or "full"'
        type: string
      sync_schedule:
        description: Cron expression for scheduled syncs (e.g., "0 */6 * * *" = every
          6 hours)
        type: string
      tenant_id:
        description: Workspace ID for multi-workspace isolation
        type: integer
      total_items_synced:
        description: Total items synced (not stored in DB, calculated on query)
        type: integer
      type:
        description: Connector type (feishu, notion, confluence, etc.)
        type: string
      updated_at:
        description: Last update timestamp
        type: string
    type: object
  types.DockerSandboxConfig:
    properties:
      cpu_limit:
        description: |-
          CPULimit is the number of CPU cores one sandbox may use. 0 uses the
          built-in default.
        type: number
      host:
        description: |-
          Host is the daemon endpoint in DOCKER_HOST form. Empty means the local
          unix socket.
        type: string
      http_timeout_sec:
        description: HTTPTimeoutSec bounds each Engine API call. 0 uses the built-in
          default.
        type: integer
      idle_ttl_seconds:
        description: |-
          IdleTTLSeconds is how long a session container may go unused before it
          is reclaimed. The daemon has no idle timeout of its own, so this is what
          stops an abandoned session from pinning host memory indefinitely.
        type: integer
      image:
        type: string
      memory_limit_mb:
        description: MemoryLimitMB caps one sandbox's memory. 0 uses the built-in
          default.
        type: integer
      network_mode:
        description: |-
          NetworkMode is the Docker network sandboxes join: "bridge" (default) or
          "none" for no egress. Nothing else is accepted — host and container:
          modes share another namespace outright, and a named network is usually
          the deployment's own compose network, which would put the sandbox next
          to Postgres and Redis.
        type: string
      pids_limit:
        description: |-
          PidsLimit caps how many processes one sandbox may run. 0 uses the
          built-in default.
        type: integer
      runtime:
        description: |-
          Runtime selects an alternative OCI runtime such as "runsc" (gVisor).
          Empty uses the daemon default.
        type: string
      tls_cert_path:
        description: |-
          TLSCertPath is a directory on the WeKnora host containing ca.pem,
          cert.pem and key.pem. Required when Host is a TCP endpoint.
        type: string
    type: object
  types.E2BHostRule:
    properties:
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers values are credentials and are encrypted at rest; names stay
          readable so operators can see which headers are injected.
        type: object
      host:
        type: string
    type: object
  types.E2BSandboxConfig:
    properties:
      api_key:
        description: 加密
        type: string
      api_url:
        type: string
      e2b_sandbox_ttl_seconds:
        type: integer
      http_timeout_sec:
        description: |-
          HTTPTimeoutSec bounds each HTTP call to the sandbox control plane.
          0 means use the built-in default (30s), never the deployment's value.
        type: integer
      proxy_url:
        description: |-
          ProxyURL is the data-plane gateway that fronts envd. E2B Cloud resolves
          "<port>-<sandboxID>.<sandbox_domain>" through public DNS and TLS, so it
          needs no value here. Self-hosted E2B-compatible control planes usually
          serve every sandbox from one gateway address and expect the sandbox
          authority in the Host header; setting this makes WeKnora dial the
          gateway directly instead of requiring wildcard DNS and a certificate
          for the sandbox domain. An "http://" gateway also downgrades the
          data-plane scheme, which the E2B SDK otherwise pins to https.
        type: string
      sandbox_domain:
        type: string
      template_id:
        type: string
    type: object
