        description: |-
          RepresentativeUserID is accepted for compatibility and ignored: a
          direct add attaches no user of the enrolled workspace, since the
          inviter must not choose whose details the roster shows.
        type: string
      role:
        description: 'Role to assign: admin/editor/viewer'
        type: string
      tenant_id:
        description: TenantID is the workspace to enrol as an org member. Preferred
          field.
        type: integer
      user_id:
        description: |-
          UserID is retained for backward compatibility. When set without
          TenantID, the handler resolves the user's TenantID.
        type: string
    required:
    - role
    type: object
  types.JoinByOrganizationIDRequest:
    properties:
      message:
        description: Optional message for join request
        maxLength: 500
        type: string
      organization_id:
        type: string
      role:
        description: 'Optional: requested role (admin/editor/viewer); default viewer'
        type: string
    required:
    - organization_id
    type: object
  types.JoinOrganizationRequest:
    properties:
      invite_code:
        maxLength: 32
        minLength: 8
        type: string
    required:
    - invite_code
    type: object
  types.KS3EngineConfig:
    properties:
      access_key:
        type: string
      bucket_name:
        type: string
      endpoint:
        type: string
      path_prefix:
        type: string
      region:
        type: string
      secret_key:
        type: string
    type: object
  types.KnowledgeBase:
    properties:
      asr_config:
        allOf:
        - $ref: '#/definitions/types.ASRConfig'
        description: ASR config (Automatic Speech Recognition)
      auto_tag_config:
        allOf:
        - $ref: '#/definitions/types.AutoTagConfig'
        description: AutoTagConfig controls asynchronous association of existing tags
          after parsing.
      chunk_count:
        description: Chunk count (not stored in database, calculated on query)
        type: integer
      chunking_config:
        allOf:
        - $ref: '#/definitions/types.ChunkingConfig'
        description: Chunking configuration
      created_at:
        description: Creation time of the knowledge base
        type: string
      creator_id:
        description: |-
          CreatorID records the user ID of whoever originally created the KB.
          Used by the workspace-level RBAC middleware to let Contributors edit
          their own KBs without granting them access to everyone else's.
          Nullable for backward compatibility with rows created before the
          RBAC migration backfilled the column to the workspace Owner.
        type: string
      creator_name:
        description: |-
          CreatorName 是 CreatorID 对应用户的展示名（username / email 等），
          仅在列表场景由 handler 批量回填，不落库；为空表示创建者无法解析（用户已删除、
          CreatorID 为空的老数据等）。前端用它在卡片来源徽章上做 mine vs workspace 的二分。
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Deletion time of the knowledge base
      description:
        description: Description of the knowledge base
        type: string
      embedding_model_id:
        description: ID of the embedding model
        type: string
      extract_config:
        allOf:
        - $ref: '#/definitions/types.ExtractConfig'
        description: Extract config
      faq_config:
        allOf:
        - $ref: '#/definitions/types.FAQConfig'
        description: FAQConfig stores FAQ specific configuration such as indexing
          strategy
      generated_profile:
        allOf:
        - $ref: '#/definitions/types.KnowledgeBaseProfile'
        description: |-
          GeneratedProfile is the machine-generated description: a gist, merged
          topics, typical questions and the aggregate snapshot they came from. It
          never overwrites the user-authored Description; both are shown to agents.
      id:
        description: Unique identifier of the knowledge base
        type: string
      image_processing_config:
        allOf:
        - $ref: '#/definitions/types.ImageProcessingConfig'
        description: Image processing configuration
      indexing_strategy:
        allOf:
        - $ref: '#/definitions/types.IndexingStrategy'
        description: |-
          IndexingStrategy controls which indexing pipelines are active for this knowledge base.
          Pipelines: vector search, keyword search, wiki generation, knowledge graph extraction.
      is_pinned:
        description: |-
          IsPinned and PinnedAt are computed per-caller from user_kb_pins
          (see migration 000050). They used to be stored on the row itself,
          which made pinning a workspace-wide ordering decision gated behind
          the kb-edit RBAC guard. The columns are still present in legacy
          schemas for rollback safety but are no longer read or written by
          the application — both fields are tagged `gorm:"-"` so GORM
          ignores them on every CRUD call and the list handler stamps them
          after enriching with the caller's pin set.
        type: boolean
      is_processing:
        description: IsProcessing indicates if there is a processing import task (for
          FAQ type knowledge bases)
        type: boolean
      is_temporary:
        description: Whether this knowledge base is temporary (ephemeral) and should
          be hidden from UI
        type: boolean
      knowledge_count:
        description: Knowledge count (not stored in database, calculated on query)
        type: integer
      name:
        description: Name of the knowledge base
        type: string
      pinned_at:
        description: |-
          PinnedAt records when the current caller pinned this knowledge
          base; nil when they have not.
        type: string
      processing_count:
        description: ProcessingCount indicates the number of knowledge items being
          processed (for document type knowledge bases)
        type: integer
      profile_config:
        allOf:
        - $ref: '#/definitions/types.KnowledgeBaseProfileConfig'
        description: |-
          ProfileConfig controls automatic generation of the knowledge-base
          description from per-document profiles (document knowledge bases only).
      question_generation_config:
        allOf:
        - $ref: '#/definitions/types.QuestionGenerationConfig'
        description: QuestionGenerationConfig stores question generation configuration
          for document knowledge bases
      share_count:
        description: ShareCount indicates the number of organizations this knowledge
          base is shared with (not stored in database)
        type: integer
      storage_backend_id:
        description: |-
          StorageBackendID binds this KB to one concrete storage instance. The
          legacy provider field remains readable during migration only.
        type: string
      storage_config:
        allOf:
        - $ref: '#/definitions/types.StorageConfig'
        description: 'Deprecated: legacy COS config column. Kept for backward compatibility
          with old data.'
      storage_provider_config:
        allOf:
        - $ref: '#/definitions/types.StorageProviderConfig'
        description: 'Storage provider config (new): only stores provider selection;
          credentials from workspace StorageEngineConfig'
      summary_model_id:
        description: Summary model ID
        type: string
      tenant_id:
        description: Workspace ID
        type: integer
      type:
        description: Type of the knowledge base (document, faq, etc.)
        type: string
      updated_at:
        description: Last updated time of the knowledge base
        type: string
      vector_store_id:
        description: |-
          VectorStoreID references the VectorStore this knowledge base is bound to.
          When nil, the KB falls back to the workspace's effective engines derived from
          the RETRIEVE_DRIVER environment variable (env store flow).
          This field is set once at creation time and must not be modified afterwards;
          enforcement lives at the GORM layer (`<-:create`) plus the service-layer
          KB update path, which omits this field from its update DTO.
        type: string
      vlm_config:
        allOf:
        - $ref: '#/definitions/types.VLMConfig'
        description: VLM config
      wiki_config:
        allOf:
        - $ref: '#/definitions/types.WikiConfig'
        description: WikiConfig stores wiki-specific configuration (only for wiki
          type knowledge bases)
    type: object
  types.KnowledgeBaseConfig:
    properties:
      auto_tag_config:
        allOf:
        - $ref: '#/definitions/types.AutoTagConfig'
        description: AutoTagConfig controls optional automatic association of existing
          KB tags.
      chunking_config:
        allOf:
        - $ref: '#/definitions/types.ChunkingConfig'
        description: Chunking configuration
      faq_config:
        allOf:
        - $ref: '#/definitions/types.FAQConfig'
        description: FAQ configuration (only for FAQ type knowledge bases)
      image_processing_config:
        allOf:
        - $ref: '#/definitions/types.ImageProcessingConfig'
        description: |-
          Image processing configuration.

          nil means "no change" when updating, the same contract IndexingStrategy
          uses. A request that does not mention this field must leave the image
          settings alone: the attribute-observation switch and the attribute policy
          are things a knowledge base accumulates, and a client that predates them
          would otherwise reset the lot on any save. Sending an object — empty
          included — replaces the whole configuration.
      indexing_strategy:
        allOf:
        - $ref: '#/definitions/types.IndexingStrategy'
        description: |-
          IndexingStrategy controls which indexing pipelines are active.
          nil means "no change" when updating (preserves existing strategy).
      profile_config:
        allOf:
        - $ref: '#/definitions/types.KnowledgeBaseProfileConfig'
        description: |-
          ProfileConfig controls optional automatic knowledge-base description
          generation. nil means "no change" when updating.
      wiki_config:
        allOf:
        - $ref: '#/definitions/types.WikiConfig'
        description: Wiki configuration (only for wiki-enabled knowledge bases)
    type: object
  types.KnowledgeBaseProfile:
    properties:
      aggregate_hash:
        description: |-
          AggregateHash identifies the aggregate the gist was generated from. A
          mismatch with the live aggregate means the text is stale.
        type: string
      error:
        description: Error holds the last generation error when Status is failed.
        type: string
      generated_at:
        description: GeneratedAt records when the text was produced.
        type: string
      gist:
        description: Gist is a short statement of what the knowledge base covers.
        type: string
      model_id:
        description: ModelID records which chat model produced the text.
        type: string
      stats:
        allOf:
        - $ref: '#/definitions/types.KnowledgeBaseProfileStats'
        description: Stats is the aggregate snapshot the text was generated from.
      status:
        description: Status is one of the KnowledgeBaseProfileStatus* values.
        type: string
      topics:
        description: Topics is the merged topic list (at most KnowledgeBaseProfileMaxTopics).
        items:
          type: string
        type: array
      typical_questions:
        description: TypicalQuestions lists questions this knowledge base can answer.
        items:
          type: string
        type: array
    type: object
  types.KnowledgeBaseProfileConfig:
    properties:
      custom_instructions:
        description: |-
          CustomInstructions is appended to the stable system prompt, e.g. the
          audience the description should address or terms to keep.
        type: string
      enabled:
        type: boolean
      model_id:
        description: ModelID overrides the chat model; empty falls back to the KB
          summary model.
        type: string
    type: object
  types.KnowledgeBaseProfileStats:
    properties:
      doc_types:
        description: DocTypes counts documents per model-assigned document type.
        items:
          $ref: '#/definitions/types.NamedCount'
        type: array
      document_count:
        description: DocumentCount is the number of eligible documents at generation
          time.
        type: integer
      earliest_at:
        description: EarliestAt and LatestAt bound document creation times.
        type: string
      file_types:
        description: FileTypes counts documents per file extension.
        items:
          $ref: '#/definitions/types.NamedCount'
        type: array
      folders:
        description: Folders lists the top-level folder names present.
        items:
          type: string
        type: array
      latest_at:
        type: string
      profiled_count:
        description: ProfiledCount is how many of them carried a document profile.
        type: integer
      raw_topics:
        description: RawTopics counts documents per normalized topic keyword before
          merging.
        items:
          $ref: '#/definitions/types.NamedCount'
        type: array
      tags:
        description: Tags counts documents per knowledge-base tag.
        items:
          $ref: '#/definitions/types.NamedCount'
        type: array
    type: object
