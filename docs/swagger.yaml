      languages:
        items:
          type: string
        type: array
      parent_chunk_size:
        type: integer
      separators:
        items:
          type: string
        type: array
      strategy:
        type: string
      token_limit:
        type: integer
    type: object
  internal_handler.PreviewChunkingRequest:
    properties:
      chunking_config:
        $ref: '#/definitions/internal_handler.PreviewChunkingPayload'
      text:
        type: string
    type: object
  internal_handler.PreviewChunkingResponse:
    properties:
      chunks:
        items:
          $ref: '#/definitions/internal_handler.PreviewChunkResult'
        type: array
      profile:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_infrastructure_chunker.DocProfile'
      rejected:
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_infrastructure_chunker.TierRejection'
        type: array
      selected_tier:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_infrastructure_chunker.StrategyTier'
      stats:
        $ref: '#/definitions/internal_handler.PreviewChunkingStats'
      tier_chain:
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_infrastructure_chunker.StrategyTier'
        type: array
    type: object
  internal_handler.PreviewChunkingStats:
    properties:
      avg_chars:
        type: integer
      count:
        type: integer
      max_chars:
        type: integer
      min_chars:
        type: integer
      stddev_chars:
        type: integer
      truncated_to:
        description: |-
          TruncatedTo, when set, is the original chunk count before the
          response was truncated to previewMaxChunks for transport.
        type: integer
    type: object
  internal_handler.PromoteUserToSystemAdminRequest:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  internal_handler.RemoteModelCheckRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret 用于 LKEAP / Volcengine Rerank 等需要第二段密钥的场景（对应模型 Parameters.AppSecret）。
        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
          secrets (APIKey, AppSecret via ExtraConfig) from the stored model
          record before assembling the test client. This lets the "Test
          connection" button work on existing models without making the
          frontend reload — and ship — the plaintext API key. Other fields
          (BaseURL, ModelName, etc.) on this request still override the
          stored values, so a user can validate a new endpoint against the
          existing credentials in one click.
        type: string
      modelName:
        type: string
      provider:
        type: string
      source:
        description: 为空时按需默认为 "remote"
        type: string
      spec:
        $ref: '#/definitions/types.ModelSpecOverride'
      supportsDimensionOverride:
        type: boolean
    required:
    - modelName
    type: object
  internal_handler.RenameKnowledgeFolderRequest:
    properties:
      from:
        type: string
      to:
        type: string
    required:
    - from
    - to
    type: object
  internal_handler.ResetUserPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
    required:
    - email
    - new_password
    type: object
  internal_handler.RevokeSystemAdminRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  internal_handler.RuntimeQueuesResponse:
    properties:
      available:
        type: boolean
      model_limiter_available:
        type: boolean
      models:
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_models_limiter.RuntimeStat'
        type: array
      parse_concurrency:
        description: compatibility alias for upstream_concurrency
        type: integer
      pools:
        items:
          $ref: '#/definitions/internal_handler.RuntimeWorkerPool'
        type: array
      queues:
        items:
          $ref: '#/definitions/types.QueueStat'
        type: array
      timestamp:
        type: integer
      upstream_concurrency:
        type: integer
      wiki_concurrency:
        description: compatibility field
        type: integer
    type: object
  internal_handler.RuntimeTasksResponse:
    properties:
      available:
        type: boolean
      has_more:
        type: boolean
      next_cursor:
        type: string
      page_size:
        type: integer
      tasks:
        items:
          $ref: '#/definitions/types.RuntimeTaskInfo'
        type: array
    type: object
  internal_handler.RuntimeWorkerPool:
    description: Return every row in the system_settings table (system-scope, not
      workspace-scoped). SystemAdmin only.
    properties:
      active:
        description: live workers assigned to this pool
        type: integer
      cluster_capacity:
        description: sum of live server concurrency
        type: integer
      concurrency:
        description: configured per instance
        type: integer
      instances:
        description: live asynq server heartbeats
        type: integer
      name:
        type: string
      queue_count:
        type: integer
      utilization:
        description: Active / ClusterCapacity
        type: number
    type: object
  internal_handler.SandboxCheckItem:
    properties:
      latency_ms:
        type: integer
      message:
        description: Message carries free-form provider detail for an executed probe.
        type: string
      name:
        type: string
      ok:
        type: boolean
      reason:
        description: |-
          Reason is a stable code explaining why a probe was skipped. It exists so
          the UI can phrase the skip in the operator's language instead of echoing
          a server-side sentence.
        type: string
    type: object
  internal_handler.SandboxCheckRequest:
    properties:
      config:
        $ref: '#/definitions/types.TenantSandboxConfig'
      config_id:
        description: |-
          ConfigID lets an edit form test stored credentials while overriding only
          the fields the admin changed in the drawer.
        type: string
      deep:
        description: |-
          Deep additionally runs a throwaway script. For remote backends this also
          creates and destroys one sandbox, which is the only way to validate the
          template ID, data plane, in-sandbox execution, and outbound egress. It may
          consume real sandbox time, so it is opt-in.
        type: boolean
    type: object
  internal_handler.SandboxCheckResponse:
    properties:
      capabilities:
        additionalProperties:
          type: boolean
        type: object
      checks:
        items:
          $ref: '#/definitions/internal_handler.SandboxCheckItem'
        type: array
      ok:
        type: boolean
      provider:
        type: string
    type: object
  internal_handler.SearchMessagesRequest:
    properties:
      limit:
        description: 'Maximum number of results to return (default: 20)'
        type: integer
      mode:
        description: 'Search mode: "keyword", "vector", "hybrid" (default: "hybrid")'
        type: string
      query:
        description: Query text for search
        type: string
      session_ids:
        description: Filter by specific session IDs (optional)
        items:
          type: string
        type: array
    required:
    - query
    type: object
  internal_handler.SearchWikiRequest:
    properties:
      knowledge_base_id:
        type: string
      knowledge_base_ids:
        items:
          type: string
        type: array
      limit:
        type: integer
