        type: array
      english_chapter_count:
        type: integer
      form_feed_count:
        type: integer
      german_chapter_count:
        type: integer
      has_code:
        type: boolean
      has_tables:
        description: Content characteristics
        type: boolean
      md_heading_counts:
        additionalProperties:
          type: integer
        description: Markdown structure
        type: object
      md_heading_total:
        type: integer
      numbered_section_count:
        description: Heuristic indicators
        type: integer
      repeated_footer_count:
        type: integer
      std_line_len:
        type: number
      total_chars:
        type: integer
      total_lines:
        type: integer
      visual_sep_count:
        type: integer
    type: object
  github_com_Tencent_WeKnora_internal_infrastructure_chunker.StrategyTier:
    enum:
    - heading
    - heuristic
    - legacy
    type: string
    x-enum-varnames:
    - TierHeading
    - TierHeuristic
    - TierLegacy
  github_com_Tencent_WeKnora_internal_infrastructure_chunker.TierRejection:
