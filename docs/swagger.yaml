    get:
      description: |-
        Server-sent replay of everything the installer agent did — the
        prompt it was given, its thinking, the commands it ran and
        their output — followed live while the install is still
        running. Frames are the same shape the chat stream uses, so a
        console renders an install with the components it renders a
        chat turn with. 404 once the event log has expired; the
        durable message history is the fallback.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill ID
        in: path
        name: skillId
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of transcript events
          schema:
            type: string
        "204":
          description: Install is still preparing; retry once locators exist
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Skill or transcript not found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Follow an install's agent transcript
      tags:
      - SandboxConfig
