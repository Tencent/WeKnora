        type: string
      status:
        type: string
      summary:
        type: string
      tenant_id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  types.WikiPageRevisionListResponse:
    properties:
      current_version:
        type: integer
      revisions:
        items:
          $ref: '#/definitions/types.WikiPageRevision'
        type: array
      total:
        type: integer
    type: object
  types.WikiPageUpdateRequest:
    properties:
      aliases:
        items:
          type: string
        type: array
      content:
        type: string
      page_type:
        type: string
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      version:
        description: |-
          Version is the optimistic-lock guard: when > 0 the update is rejected
          with a conflict if the stored version differs (someone else edited the
          page since the client loaded it). 0 skips the check (legacy clients).
        type: integer
    type: object
  types.WikiStats:
    properties:
      is_active:
        description: whether wiki ingestion is currently running
        type: boolean
      orphan_count:
        description: pages with no inbound links
        type: integer
      pages_by_type:
        additionalProperties:
          format: int64
          type: integer
        type: object
      pending_issues:
        description: number of pending wiki issues
        type: integer
      pending_tasks:
        description: number of documents waiting to be ingested
        type: integer
      recent_updates:
        description: last N updated pages
        items:
          $ref: '#/definitions/types.WikiPage'
        type: array
      total_links:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    name: WeKnora Github
    url: https://github.com/Tencent/WeKnora
  description: WeKnora 知识库管理系统 API 文档
  termsOfService: http://swagger.io/terms/
  title: WeKnora API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: 基于Agent的智能问答，支持多轮对话和SSE流式响应
      parameters:
      - description: 会话ID
        in: path
        name: session_id
        required: true
        type: string
      - description: 问答请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: 文件引用形式，public 返回可加载直链
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 问答结果（SSE流）
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Agent问答
      tags:
      - 问答
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: 用户在对话中完成 OAuth 授权后调用，校验令牌存在后恢复被暂停的 Agent 工具调用
      parameters:
      - description: 待授权 ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.AppError'
        "409":
          description: 用户尚未完成授权
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 完成对话内 MCP OAuth 授权
      tags:
      - MCP服务
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: 用户主动跳过 OAuth 授权，解除 Agent 阻塞
      parameters:
      - description: 待授权 ID
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 跳过对话内 MCP OAuth 授权
      tags:
      - MCP服务
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: 用户审批通过或驳回一次工具调用（用于 Agent 阻塞等待审批的场景）
      parameters:
      - description: 待审批记录 ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 审批结果
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 待审批记录不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 处理 MCP 工具调用待审批请求
      tags:
      - MCP服务
  /agents:
    get:
      consumes:
      - application/json
      description: 获取当前空间的所有智能体（包括内置智能体）
      produces:
      - application/json
      responses:
        "200":
          description: 智能体列表
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 获取智能体列表
      tags:
      - 智能体
    post:
      consumes:
      - application/json
      description: 创建新的自定义智能体
      parameters:
      - description: 智能体信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建的智能体
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 创建智能体
      tags:
      - 智能体
  /agents/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的智能体
      parameters:
      - description: 智能体ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 无法删除内置智能体
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 智能体不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 删除智能体
      tags:
      - 智能体
    get:
      consumes:
      - application/json
      description: 根据ID获取智能体详情
      parameters:
      - description: 智能体ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 智能体详情
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 智能体不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 获取智能体详情
      tags:
      - 智能体
    put:
      consumes:
      - application/json
      description: 更新智能体的名称、描述和配置
      parameters:
      - description: 智能体ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的智能体
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 无法修改内置智能体
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 更新智能体
      tags:
      - 智能体
  /agents/{id}/copy:
    post:
      consumes:
      - application/json
      description: 复制指定的智能体
      parameters:
      - description: 智能体ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: 复制成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 智能体不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 复制智能体
      tags:
      - 智能体
  /agents/{id}/shares/{share_id}:
    delete:
      description: 从智能体的共享列表中移除指定共享关系
      parameters:
      - description: 智能体 ID
        in: path
        name: id
        required: true
        type: string
      - description: 共享记录 ID
        in: path
        name: share_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true'
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 取消智能体共享
      tags:
      - 组织
  /agents/{id}/suggested-questions:
    get:
      consumes:
      - application/json
      description: 基于智能体关联的知识库，返回推荐问题供用户快捷提问
      parameters:
      - description: 智能体ID
        in: path
        name: id
        required: true
        type: string
      - description: 知识库ID列表（逗号分隔），覆盖智能体默认配置
        in: query
        name: knowledge_base_ids
        type: string
      - description: 知识ID列表（逗号分隔），限定到具体文档
        in: query
        name: knowledge_ids
        type: string
      - description: 带知识库归属的标签范围（JSON）
        in: query
        name: tag_scopes
        type: string
      - description: 返回数量上限（未传时使用智能体配置的开场问题数量，最大30）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 推荐问题列表
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 智能体不存在
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 获取推荐问题
      tags:
      - 智能体
  /agents/placeholders:
    get:
      consumes:
      - application/json
      description: 获取所有可用的提示词占位符定义，按字段类型分组
      produces:
      - application/json
      responses:
        "200":
          description: 占位符定义
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 获取占位符定义
      tags:
      - 智能体
  /agents/type-presets:
    get:
      consumes:
      - application/json
      description: 返回所有 smart-reasoning 下可用的智能体类型预设（RAG/Wiki/Hybrid/Custom），用于编辑器自动填充系统提示词、工具和
        KB 兼容性
      produces:
      - application/json
      responses:
        "200":
          description: 预设列表
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 获取智能体类型预设列表
      tags:
      - 智能体
  /api/v1/knowledge/{id}/spans:
    get:
      consumes:
      - application/json
      description: 返回该知识在解析流水线的 trace tree（root → stage → subspan）：每段状态、耗时、input/output、错误码、langfuse_trace_id。支持
        ?attempt=N 查看历史尝试；不传则返回最新尝试。前端用于渲染时间线 + 多模态/embedding 子节点 + 一键跳转 Langfuse。
      parameters:
      - description: 知识ID
        in: path
        name: id
        required: true
        type: string
      - description: 指定尝试号；省略=最新
        in: query
        name: attempt
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取知识文档解析的 Span 树（含历史尝试）
      tags:
      - 知识管理
  /artifacts:
    delete:
      description: 删除产物库中的一个文件。产物库一行代表一个文件的最新版本，默认连同该文件在本会话中的所有历史版本一并删除
      parameters:
      - description: 会话ID
        in: query
        name: session_id
        required: true
        type: string
      - description: 消息ID
        in: query
        name: message_id
        required: true
        type: string
      - description: 产物在消息中的位置
        in: query
        name: index
        required: true
        type: integer
      - description: 是否删除所有版本，默认 true
        in: query
        name: all_versions
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 删除产物库中的文件
      tags:
      - 会话
    get:
      description: 跨会话列出当前用户可见会话中技能生成的文件，每个文件只返回最新版本（不含存储 URL）
      parameters:
      - description: 按文件名过滤
        in: query
        name: keyword
        type: string
      - description: 逗号分隔的扩展名，如 .pdf,.pptx
        in: query
        name: file_types
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量（最大 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 列出我的产物
      tags:
      - 会话
  /auth/auto-setup:
    post:
      consumes:
      - application/json
      description: Lite 版专用：首次启动时自动创建默认用户和空间并返回令牌，首次及后续启动均须通过桌面原生凭据认证，免除手动注册/登录流程
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginResponse'
        "403":
          description: 非 Lite 版本
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: 自动初始化（Lite 桌面版）
      tags:
      - 认证
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前用户的登录密码。新密码须满足 8–32 位且同时包含字母与数字；开启复杂密码后还需包含大小写与特殊字符。成功后所有会话被撤销，需重新登录。
      parameters:
      - description: 密码修改请求
        in: body
        name: request
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 修改密码
      tags:
      - 认证
  /auth/config:
    get:
      consumes:
      - application/json
      description: 返回当前部署的注册模式与密码复杂度开关，供前端决定是否展示注册入口以及密码校验规则
      produces:
      - application/json
      responses:
        "200":
          description: 认证配置
          schema:
            additionalProperties: true
            type: object
      summary: 获取认证配置
      tags:
      - 认证
  /auth/invitations/lookup:
    post:
      consumes:
      - application/json
      description: |-
        根据邀请链接中的 token 返回邀请上下文（空间名 / 角色 / 过期时间），
        供注册页展示。无认证；token 无效或被撤销返回 410。
        使用 POST + body 而非 GET + path，避免 token 落入访问日志 / 浏览器历史 / tracing。
      parameters:
      - description: 邀请 token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.invitationLookupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.invitationLookupResponse'
        "410":
          description: 链接无效或已撤销
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      summary: 解析共享邀请链接 token
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录并获取访问令牌
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginResponse'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销当前访问令牌并登出
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 用户登出
      tags:
      - 认证
  /auth/me:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /auth/me/preferences:
    put:
      consumes:
      - application/json
      description: |-
        按 PATCH 语义合并用户偏好（仅覆盖请求体里出现的字段，其余字段保持不变），
        数据存放在 users.preferences (JSON)，跨设备/浏览器自动同步。
      parameters:
      - description: Preferences patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateMyPreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的偏好
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: 更新当前用户的个性化设置
      tags:
      - 认证
  /auth/oidc/callback:
    get:
      consumes:
      - application/json
      description: 接收OIDC provider回调并由后端完成code交换，随后重定向回前端登录页
      parameters:
      - description: OIDC授权码
        in: query
        name: code
        type: string
      - description: OIDC状态
        in: query
        name: state
        type: string
      - description: OIDC错误码
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
