        type: array
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      priority:
        description: Priority order for UI display (lower = higher priority)
        type: integer
      type:
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_errors.AppError:
