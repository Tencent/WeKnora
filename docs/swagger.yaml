    - SeverityError
  github_com_Tencent_WeKnora_internal_application_service.WikiLintIssueType:
    enum:
    - orphan_page
    - broken_link
    - stale_ref
    - missing_cross_ref
    - empty_content
    - duplicate_slug
    type: string
    x-enum-varnames:
    - LintIssueOrphanPage
    - LintIssueBrokenLink
    - LintIssueStaleRef
    - LintIssueMissingCrossRef
    - LintIssueEmptyContent
