      - Bearer: []
      - ApiKeyAuth: []
      summary: List storage backends
      tags:
      - StorageBackend
    post:
      consumes:
      - application/json
      description: Register a new object/file storage instance for the current workspace.
        The configuration is validated and a connectivity test is run before the backend
        is persisted.
      parameters:
      - description: Storage backend configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created storage backend
