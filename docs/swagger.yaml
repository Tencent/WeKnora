          schema:
            additionalProperties: true
            type: object
        "404":
          description: Provider 不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: 更新网络搜索 Provider
      tags:
      - 网络搜索
  /web-search-providers/{id}/test:
    post:
