        type: boolean
    type: object
  internal_handler.GetSystemInfoResponse:
    properties:
      build_time:
        type: string
      commit_id:
        type: string
      db_migration_error:
        description: |-
          DBMigrationError carries the human-readable error message recorded when
          the most recent startup migration attempt failed. Empty when migrations
          succeeded; non-empty values let the frontend surface a troubleshooting
          banner instead of silently hiding the DB version row (see issue #1319).
        type: string
      db_version:
        type: string
      edition:
        type: string
      go_version:
        type: string
      graph_database_engine:
        type: string
      keyword_index_engine:
        type: string
      minio_enabled:
        type: boolean
      started_at:
        description: StartedAt is the server process boot time (RFC3339, UTC).
        type: string
      uptime_seconds:
        description: UptimeSeconds is seconds elapsed since process start.
        type: integer
      vector_store_engine:
        type: string
      version:
        type: string
    type: object
  internal_handler.InitializationRequest:
    properties:
      documentSplitting:
        properties:
          chunkOverlap:
            minimum: 0
            type: integer
          chunkSize:
            maximum: 10000
            minimum: 100
            type: integer
          separators:
            items:
              type: string
            minItems: 1
            type: array
        required:
        - chunkSize
        - separators
        type: object
      embedding:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          dimension:
            description: 添加embedding维度字段
            type: integer
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      llm:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      multimodal:
        properties:
          cos:
            properties:
              appId:
                type: string
              bucketName:
                type: string
              pathPrefix:
                type: string
              region:
                type: string
              secretId:
                type: string
              secretKey:
                type: string
            type: object
          enabled:
            type: boolean
          minio:
            properties:
              bucketName:
                type: string
              pathPrefix:
                type: string
            type: object
          storageType:
            type: string
          vlm:
            properties:
              apiKey:
                type: string
              baseUrl:
                type: string
              interfaceType:
                description: '"ollama" or "openai"'
                type: string
              modelName:
                type: string
            type: object
        type: object
      nodeExtract:
        properties:
          enabled:
            type: boolean
          nodes:
            items:
              properties:
                attributes:
                  items:
                    type: string
                  type: array
                name:
                  type: string
              type: object
            type: array
          relations:
            items:
              properties:
                node1:
                  type: string
                node2:
                  type: string
                type:
                  type: string
              type: object
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        properties:
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      rerank:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          enabled:
            type: boolean
          modelName:
            type: string
        type: object
    required:
    - documentSplitting
    - embedding
    - llm
    type: object
  internal_handler.KBModelConfigRequest:
    properties:
      asr_config:
        $ref: '#/definitions/types.ASRConfig'
      documentSplitting:
        description: 文档分块配置
        properties:
          childChunkSize:
            type: integer
          chunkOverlap:
            type: integer
          chunkSize:
            type: integer
          enableParentChild:
            type: boolean
          languages:
            items:
              type: string
            type: array
          parentChunkSize:
            type: integer
          parserEngineRules:
            items:
              $ref: '#/definitions/types.ParserEngineRule'
            type: array
          separators:
            items:
              type: string
            type: array
          strategy:
            description: |-
              Strategy / TokenLimit / Languages use pointer types so the
              handler can distinguish "field absent in payload" (no change)
              from "field present with empty/zero value" (clear / disable).
              Without that distinction, users could set strategy="auto" once
              but never reset it back to legacy / unset.
            type: string
          tableMetadataInstructions:
            type: string
          tokenLimit:
            type: integer
        type: object
      embeddingModelId:
        description: optional when RAG indexing is disabled
        type: string
      llmModelId:
        type: string
      multimodal:
        description: 多模态配置（仅模型相关；存储引擎在 storageProvider 中配置）
        properties:
          enabled:
            type: boolean
        type: object
      nodeExtract:
        description: 知识图谱配置
        properties:
          customInstructions:
            type: string
          enabled:
            type: boolean
          nodes:
            items:
              $ref: '#/definitions/types.GraphNode'
            type: array
          relations:
            items:
              $ref: '#/definitions/types.GraphRelation'
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        description: 问题生成配置
        properties:
          customInstructions:
            type: string
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      storageBackendId:
        type: string
      storageProvider:
        description: 存储引擎选择（"local" | "minio" | "cos"），影响文档上传与文档内图片存储，参数从全局设置读取
        type: string
      vlm_config:
        $ref: '#/definitions/types.VLMConfig'
    required:
    - llmModelId
    type: object
  internal_handler.ListSystemAdminsResponse:
    properties:
      admins:
        items:
          $ref: '#/definitions/types.UserInfo'
        type: array
      total:
        type: integer
    type: object
  internal_handler.ModelTestRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret 用于 LKEAP / Volcengine Rerank 等需要第二段密钥的场景（对应模型 Parameters.AppSecret）。
        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
          secrets (APIKey, AppSecret via ExtraConfig) from the stored model
          record before assembling the test client. This lets the "Test
          connection" button work on existing models without making the
          frontend reload — and ship — the plaintext API key. Other fields
          (BaseURL, ModelName, etc.) on this request still override the
          stored values, so a user can validate a new endpoint against the
          existing credentials in one click.
        type: string
      modelName:
        type: string
      provider:
        type: string
      source:
        description: 为空时按需默认为 "remote"
        type: string
      spec:
        $ref: '#/definitions/types.ModelSpecOverride'
      supportsDimensionOverride:
        type: boolean
    required:
    - modelName
    type: object
  internal_handler.MoveKnowledgeRequest:
    properties:
      knowledge_ids:
        items:
          type: string
        minItems: 1
        type: array
      mode:
        enum:
        - reuse_vectors
        - reparse
        type: string
      source_kb_id:
        type: string
      target_kb_id:
        type: string
    required:
    - knowledge_ids
    - mode
    - source_kb_id
    - target_kb_id
    type: object
  internal_handler.MoveKnowledgeResponse:
    properties:
      knowledge_count:
        type: integer
      message:
        type: string
      source_kb_id:
        type: string
      target_kb_id:
        type: string
      task_id:
        type: string
    type: object
  internal_handler.MoveKnowledgeToFolderRequest:
    properties:
      folder_path:
        description: |-
          FolderPath is the destination folder; the empty string is the knowledge
          base top level. It is deliberately not `binding:"required"` so documents
          can be moved back out of every folder.
        type: string
      kb_id:
        type: string
      knowledge_ids:
        items:
          type: string
        type: array
    required:
    - kb_id
    - knowledge_ids
    type: object
  internal_handler.PreviewChunkResult:
    properties:
      content:
        type: string
      context_header:
        type: string
      end:
