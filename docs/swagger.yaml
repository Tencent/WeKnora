  /system/admin/audit-log:
    get:
      description: 返回 system-scope（tenant_id=0）的审计事件，覆盖 system.setting_changed / system.admin_promoted
        / system.admin_revoked 等 SystemAdmin 操作。按 id 倒序的游标分页。
      parameters:
      - description: 游标：返回 id 小于此值的记录（默认从最新开始）
        in: query
        name: after_id
        type: integer
      - description: 页大小，1-100，默认 50
        in: query
