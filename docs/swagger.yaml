        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 不支持的键
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
