interface:
  display_name: "单视频知识提取 V2"
  short_description: "生成五类知识候选与证据贡献，由服务端确定规范身份"
  default_prompt: "使用 $extract-video-knowledge 处理单视频知识。开始前完整读取 SKILL.md、references/type-frameworks.md、references/wiki-schema.md、references/audit-rules.md，并在组装输出前读取 references/output-examples.md；只提交候选和证据贡献，从源文档 evidence_sentence_ids 逐字复制证据 ID，实际调用 wiki_write_page 提交候选，最终报告不能代替工具调用；review_required 只停止当前候选，继续处理其他候选；后续只使用写入工具返回的规范身份。"
policy:
  allow_implicit_invocation: true
