# ============================================================
#  WeKnora (vidsage) 生产环境 Compose Override 模板
#  ============================================================
#
#  【使用方法】
#    1. 将本文件复制到 服务器 /opt/vidsage/ 目录，命名为 docker-compose.cloud.yml
#       cp deploy/examples/docker-compose.cloud.example.yml \
#          /opt/vidsage/docker-compose.cloud.yml
#    2. 在 .env 设置 CUSTOM_IMAGE_TAG（GitHub Actions 成功构建的 custom-<commit8>）
#       并按本环境实际情况修改资源限制、环境变量来源
#    3. 永远双文件启动（单文件必出 502 / 端口丢失 / 网络断连）：
#       cd /opt/vidsage
#       sudo docker compose -f docker-compose.yml -f docker-compose.cloud.yml pull frontend custom-backend
#       sudo docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d frontend custom-backend
#       sudo docker compose -f docker-compose.yml -f docker-compose.cloud.yml ps
#
#  【版本控制原则】
#    · 本地仓库只存模板（本文件），不存服务器私有镜像 Tag、资源配额等现场值
#    · 服务器的 docker-compose.cloud.yml 为"派生文件"，每次修改先改模板，再复制到服务器
#    · 每次替换镜像 Tag 前先备份：
#       cp docker-compose.cloud.yml docker-compose.cloud.yml.bak-$(date +%Y%m%d%H%M%S)
#
#  【镜像 Tag 约定】—— 与 output/development/个性化代码部署与发布流程.md §4.1 完全一致
#    · 前缀 lizi586586/ （Docker Hub 用户名，按实际改为自己的）
#    · UI:       vidsage-ui             :custom-${COMMIT8}
#    · 后端独立: vidsage-custom-backend :custom-${COMMIT8}
#    · COMMIT8 必须是 GitHub Actions 构建成功的提交短 SHA，不能使用 latest。
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. 前端 UI（必二开，每改 frontend/ 或 nginx.conf 都要重新打镜像）
  #    基础 docker-compose.yml 已经声明了 ports/container_name/networks/volumes，
  #    这里只覆盖 image + depends_on.condition + deploy.resources
  # ----------------------------------------------------------
  frontend:
    image: ${DOCKERHUB_USERNAME:-lizi586586}/vidsage-ui:${CUSTOM_IMAGE_TAG:?CUSTOM_IMAGE_TAG must be set to a published custom tag}
    depends_on:
      app:
        condition: service_healthy
      custom-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ----------------------------------------------------------
  # 2. WeKnora 官方 app（官方版本升级 / 确需二开官方 Go 源码时才需要覆盖 image）
  #    **其余发布一律不需要改这一节**，保持官方镜像即可
  # ----------------------------------------------------------
  # app:
  #   image: lizi586586/vidsage-app:custom-v0.7.3-20260901120000-aaaaaaaa
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.80"
  #         memory: 1024M
  #       reservations:
  #         cpus: "0.10"
  #         memory: 256M

  # ----------------------------------------------------------
  # 3. 个性化后端独立服务（custom-backend · 唯一后端部署方式，默认启用）
  #    ⚠️ 因为基础 docker-compose.yml 官方不包含此服务，
  #       所以本 override 中必须写全 container_name/networks/restart 等全部字段
  # ----------------------------------------------------------
  custom-backend:
    container_name: vidsage-custom-backend
    image: ${DOCKERHUB_USERNAME:-lizi586586}/vidsage-custom-backend:${CUSTOM_IMAGE_TAG:?CUSTOM_IMAGE_TAG must be set to a published custom tag}

    # 依赖顺序：数据库 / Redis / 官方 app 全部 healthy 后才启
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      custom-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

    # 必须与基础 compose 里定义的默认网络同名，
    # 才能通过 hostname "app" / "postgres" / "redis" / "neo4j" 互相访问
    networks:
      - WeKnora-network

    restart: unless-stopped

    environment:
      # 通用
      TZ: Asia/Shanghai
      CUSTOM_LOG_LEVEL: info
      CUSTOM_SERVER_HOST: 0.0.0.0
      CUSTOM_SERVER_PORT: "8090"
      CUSTOM_DB_DRIVER: postgres
      CUSTOM_DB_HOST: postgres
      CUSTOM_DB_PORT: "5432"
      CUSTOM_DB_USER: "${DB_USER:?DB_USER must be set}"
      CUSTOM_DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      # 基础 Compose 只会创建 DB_NAME；默认复用它，避免 custom-backend 首启时因
      # vidsage 独立库尚未手动创建而退出。需要独立库时，先创建后再显式设置 CUSTOM_DB_NAME。
      CUSTOM_DB_NAME: "${CUSTOM_DB_NAME:-${DB_NAME:?DB_NAME must be set}}"

      # 复用官方服务 —— 通过 compose network 内 hostname 访问，不走公网
      WEKNORA_BASE_URL: "http://app:8080"
      WEKNORA_API_KEY: "${WEKNORA_API_KEY:-}"
      WEKNORA_KB_ID: "${WEKNORA_KB_ID:-}"
      WEKNORA_TENANT_ID: "${WEKNORA_TENANT_ID:-}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID must be set}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY must be set}"
      MINIO_BUCKET: "${CUSTOM_MINIO_BUCKET:-vidsage}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
      MINIO_PUBLIC_URL: "${CUSTOM_MINIO_PUBLIC_URL:-}"
      # 仅在浏览器可访问的 S3/MinIO endpoint 上配置；留空时自动走受校验上传网关。
      # 例如同机 MinIO 暴露在公网 9000 端口：CUSTOM_MINIO_UPLOAD_URL=http://<公网域名>:9000
      MINIO_UPLOAD_URL: "${CUSTOM_MINIO_UPLOAD_URL:-}"

      # 通义听悟与内容生产配置
      TONGYI_API_KEY: "${TONGYI_API_KEY:-}"
      TONGYI_ACCESS_KEY_ID: "${TONGYI_ACCESS_KEY_ID:-}"
      TONGYI_ACCESS_KEY_SECRET: "${TONGYI_ACCESS_KEY_SECRET:-}"
      TONGYI_APP_KEY: "${TONGYI_APP_KEY:-}"
      TONGYI_ENDPOINT: "${TONGYI_ENDPOINT:-https://tingwu.cn-beijing.aliyuncs.com}"
      CUSTOM_CONTENT_AGENT_ID: "${CUSTOM_CONTENT_AGENT_ID:-}"
      CUSTOM_LLM_PROVIDER: "${CUSTOM_LLM_PROVIDER:-openai-compatible}"
      CUSTOM_LLM_BASE_URL: "${CUSTOM_LLM_BASE_URL:-}"
      CUSTOM_LLM_API_KEY: "${CUSTOM_LLM_API_KEY:-}"
      CUSTOM_LLM_MODEL: "${CUSTOM_LLM_MODEL:-}"
      CUSTOM_LLM_PROMPT_VERSION: "${CUSTOM_LLM_PROMPT_VERSION:-direct-content-v1}"
      CUSTOM_LLM_TIMEOUT_SECONDS: "${CUSTOM_LLM_TIMEOUT_SECONDS:-180}"
      CUSTOM_LLM_MAX_TOKENS: "${CUSTOM_LLM_MAX_TOKENS:-8192}"
      CUSTOM_WORKER_POLL_INTERVAL: "${CUSTOM_WORKER_POLL_INTERVAL:-5}"
      CUSTOM_WORKER_MAX_ATTEMPTS: "${CUSTOM_WORKER_MAX_ATTEMPTS:-3}"
      CUSTOM_WORKER_CONCURRENCY: "${CUSTOM_WORKER_CONCURRENCY:-2}"
      # 上传调优：8MB 起步，大文件（默认 >=256MB）自动使用 16MB。
      CUSTOM_UPLOAD_PART_SIZE_MB: "${CUSTOM_UPLOAD_PART_SIZE_MB:-8}"
      CUSTOM_UPLOAD_LARGE_FILE_THRESHOLD_MB: "${CUSTOM_UPLOAD_LARGE_FILE_THRESHOLD_MB:-256}"
      CUSTOM_UPLOAD_INITIAL_CONCURRENCY: "${CUSTOM_UPLOAD_INITIAL_CONCURRENCY:-2}"
      CUSTOM_UPLOAD_MIN_CONCURRENCY: "${CUSTOM_UPLOAD_MIN_CONCURRENCY:-1}"
      CUSTOM_UPLOAD_MAX_CONCURRENCY: "${CUSTOM_UPLOAD_MAX_CONCURRENCY:-4}"
      CUSTOM_UPLOAD_SIGN_TTL_SECONDS: "${CUSTOM_UPLOAD_SIGN_TTL_SECONDS:-3600}"

    # 2C4G 服务器资源总盘子留位：
    #   postgres + redis + minio + neo4j + app + docreader ≈ 1.6C / 2.1G
    #   frontend ≈ 0.5C / 512M
    #   custom-backend ≈ 0.5C / 512M（下方）
    #   余裕 ≈ 0.4C / 512M（给宿主机与突发）
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    # ⭐ 禁止映射 host port：只允许经 Nginx /api/custom/* 反代进入，
    #    否则公网直连会绕过 Nginx 层的超时/大小限制/统一鉴权。
    # ports: []

  # ----------------------------------------------------------
  # 4. custom-backend 独立数据库初始化（幂等一次性任务）
  #    基础 Compose 只创建 DB_NAME；CUSTOM_DB_NAME 使用独立库时，在后端启动前创建它。
  # ----------------------------------------------------------
  custom-db-init:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: vidsage-custom-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        db_name="${CUSTOM_DB_NAME:-${DB_NAME:?DB_NAME must be set}}"
        case "$$db_name" in
          *[!A-Za-z0-9_]*|'')
            echo "[custom-db-init] CUSTOM_DB_NAME must contain only letters, numbers, and underscores" >&2
            exit 1
            ;;
        esac
        if psql -h postgres -U "${DB_USER:?DB_USER must be set}" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='$$db_name'" | grep -q 1; then
          echo "[custom-db-init] database '$$db_name' already exists."
        else
          psql -h postgres -U "${DB_USER:?DB_USER must be set}" -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$db_name\" TEMPLATE template0;"
          echo "[custom-db-init] database '$$db_name' created."
        fi
    networks:
      - WeKnora-network
    restart: "no"

# ----------------------------------------------------------
# 网络：与基础 docker-compose.yml 保持同名（已存在，无需 driver 定义）
# ----------------------------------------------------------
networks:
  WeKnora-network:
    external: false
